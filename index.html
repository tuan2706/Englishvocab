function deckJustLearned(){ return (state.deck||[]).filter(v=>v && DATA.learned[v.id]); }

/* ---------- REVIEW = LỊCH TỪ ĐÃ HỌC ---------- */
// Ngày học của 1 từ: ưu tiên firstDay, else suy từ ts.
function learnedDayOf(id){
  const L=DATA.learned[id]; if(!L) return null;
  if(L.firstDay) return L.firstDay;
  if(L.ts){ const d=new Date(L.ts); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
  return null;
}
// Map: 'YYYY-MM-DD' -> [vocabId,...]
function learnedByDay(){
  const map={};
  for(const id in DATA.learned){
    const day=learnedDayOf(id); if(!day) continue;
    (map[day]=map[day]||[]).push(id);
  }
  return map;
}
const TYPE_VI = {
  'noun':'Danh từ','noun phrase':'Cụm danh từ','verb':'Động từ','phrasal verb':'Cụm động từ',
  'adjective':'Tính từ','adverb':'Trạng từ','collocation':'Cụm từ','idiom':'Thành ngữ',
  'preposition':'Giới từ','conjunction':'Liên từ','phrase':'Cụm từ','expression':'Cách diễn đạt',
  'determiner':'Từ hạn định','pronoun':'Đại từ'
};
function typeVi(t){ return TYPE_VI[t] || t || ''; }
function ymd(y,m,d){ return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }

  }
  const weak=weakWordList();
  if(weak.length){
    body += `<button class="weak-card" onclick="startWeakTraining()">
      <div class="wc-body">
        <div class="wc-t">🎯 Luyện từ tôi đang yếu</div>
        <div class="wc-s">${weak.length} từ cần củng cố thêm</div>
      </div>
      <span class="wc-arrow">▸</span>
    </button>`;
  }

  // Header tháng + nút chuyển
  const monthName=`Tháng ${m+1}, ${y}`;
  body += `<div class="cal-head">
    <button class="icon-btn" onclick="calPrev()" aria-label="Tháng trước">${svg(IC.back,18)}</button>
    <div class="cal-title">${monthName}</div>
    <button class="icon-btn" onclick="calNext()" aria-label="Tháng sau"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
  </div>`;

  // Lưới lịch (T2..CN)
  const dows=['T2','T3','T4','T5','T6','T7','CN'];
  const firstDow=(new Date(y,m,1).getDay()+6)%7; // 0=T2
  const daysInMonth=new Date(y,m+1,0).getDate();
  let cells='';
  for(const d of dows) cells+=`<div class="cal-dow">${d}</div>`;
  for(let i=0;i<firstDow;i++) cells+=`<div class="cal-cell empty"></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const key=ymd(y,m,d);
    const cnt=(byDay[key]||[]).length;
    const isToday=key===todayKey;
    const isSel=state.calSel===key;
    const badge = cnt>0 ? `<span class="cal-badge">+${cnt}</span>` : `<span class="cal-badge empty">·</span>`;
    cells+=`<button class="cal-cell${isToday?' today':''}${isSel?' sel':''}${cnt>0?' has':''}" onclick="calSelect('${key}')">
      <span class="cal-num">${d}</span>${badge}</button>`;
  }
  body += `<div class="cal-grid">${cells}</div>`;

  // Panel danh sách từ của ngày được chọn
  if(state.calSel){
    const ids=(byDay[state.calSel]||[]);
    const [yy,mm,dd]=state.calSel.split('-');
    const label=`${+dd}/${+mm}/${yy}`;
    if(!ids.length){
      body += `<div class="daylist"><div class="daylist-head">📆 ${label}</div>
        <div class="empty" style="padding:24px 12px"><div class="e">🌱</div>Ngày này bạn chưa học từ nào.</div></div>`;
    }else{
      body += `<div class="daylist"><div class="daylist-head">📆 ${label} · Đã học ${ids.length} từ</div>

  } else {
    body += `<div class="cal-hint">👆 Bấm vào một ngày để xem những từ bạn đã học hôm đó.</div>`;
  }
  return body;
}

/* Bộ chấm CỤC BỘ (Phase 2 — chưa AI). Trả về JSON cùng format Phase 3 sẽ dùng,
   để khi cắm Gemini vào không phải sửa UI. */
function gradeLocally(sentence, vocab, ex){
  ex = ex || getExercises(vocab)[0] || {targetPhrase:vocab.word};
  const raw = sentence.trim();
  const s = raw.toLowerCase();
  const target = ex.targetPhrase.toLowerCase();
  const words = s.split(/\s+/).filter(Boolean);

  // target dùng chưa? (khớp mềm: bỏ dấu câu, cho phép biến thể "-" / khoảng trắng)
  const norm = x => x.replace(/[^a-z\s]/g,'').replace(/\s+/g,' ').trim();
  const targetUsed = norm(s).includes(norm(target)) ||
    norm(target).split(' ').every(t=>norm(s).split(' ').includes(t));

  const fixes = [];        // { bad, good }
  const feedback = [];     // string[] tiếng Việt

  // Heuristic lỗi phổ biến người Việt (chỉ gợi ý, không phải chấm tuyệt đối)
  if(words.length && !/[.!?]$/.test(raw)) feedback.push('Câu nên kết thúc bằng dấu chấm.');
  if(/\bi\b/.test(s) && !/\bI\b/.test(raw)) { fixes.push({bad:'i', good:'I', tag:'Viết hoa', reason:'Chữ "I" luôn viết hoa.', example:'I am happy.'}); }
  // "I am + V-nguyên thể" (lỗi hay gặp)
  const amVerb = s.match(/\bi am (\w+)\b/);
  if(amVerb && !/ing$|tired|happy|ready|sure|able|responsible|interested/.test(amVerb[1])){
    feedback.push('Cẩn thận "I am + động từ": thường dùng "I " + động từ (vd: "I help"), hoặc "I am " + V-ing.');
  }
  // lặp từ liền nhau
  for(let i=1;i<words.length;i++){ if(words[i]===words[i-1] && words[i].length>2){ fixes.push({bad:words[i]+' '+words[i], good:words[i], tag:'Lặp từ', reason:'Bị lặp từ liền nhau.', example:''}); break; } }

  // Điểm từng tiêu chí (ước lượng cục bộ)
  const lenOk = words.length>=4 && words.length<=40;
  let vocabularyScore = targetUsed?100:25;
  let grammarScore = Math.max(40, 100 - fixes.length*18 - (lenOk?0:15));
  let meaningScore = targetUsed? (lenOk?85:70) : 45;
  let naturalnessScore = Math.max(45, grammarScore - 8 + (lenOk?5:0));
  let score = Math.round(vocabularyScore*.3 + grammarScore*.3 + meaningScore*.25 + naturalnessScore*.15);
  // Thiếu cụm mục tiêu là lỗi nặng nhất trong app này → trần điểm 55
  if(!targetUsed) score = Math.min(score, 55);
  const isAcceptable = targetUsed && score>=70;

  if(!targetUsed) feedback.unshift(`Bạn chưa dùng cụm mục tiêu "${ex.targetPhrase}". Hãy đưa nó vào câu.`);
  if(targetUsed && !feedback.length) feedback.push('Câu ổn! Bạn đã dùng đúng cụm mục tiêu.');

  return {
    score, meaningScore, grammarScore, vocabularyScore, naturalnessScore,
    targetWordUsed: targetUsed, isAcceptable,
    originalSentence: raw,
    correctedSentence: raw,
    fixes,
    feedback,
    explanationVi: targetUsed
      ? 'Đây là chấm cơ bản bằng máy. Bật AI trong Cài đặt để có phân tích ngữ pháp, chữa câu chi tiết và câu mẫu tốt nhất.'
      : 'Câu chưa đạt vì thiếu cụm mục tiêu. Hãy viết lại và chèn cụm đó vào.',
    bestVersion: '',          // chỉ AI mới đề xuất câu mẫu
    moreNaturalVersion: '',
    _local: true,
  };
}
async function evaluateAnswer(){
  const v=state.practiceVocab; const sent=(state.practiceInput||'').trim();
  if(!sent){ toast('Hãy nhập câu trước đã'); return; }
  // Không có key → chấm máy luôn (UI đã báo trước cần bật AI)
  if(!hasKey()){ const r=gradeLocally(sent,v); finishEvaluation(v,r); return; }
  if(!isOnline()){ state.practiceError='OFFLINE'; state.tab='result'; render(); document.getElementById('main').scrollTop=0; return; }
  // Có key + online → gọi AI, có loading
  state.practiceLoading=true; state.practiceError=null; render();
  try{
    const r = await evaluateWithGemini(sent, v);
    state.practiceLoading=false;
    finishEvaluation(v, r);
  }catch(e){
    // KHÔNG âm thầm chấm máy: hiện rõ lý do + để nút "Chấm bằng máy"
    state.practiceLoading=false;
    state.practiceError=e.message||'UNKNOWN';
    state.tab='result'; render(); document.getElementById('main').scrollTop=0;
  }
}
function finishEvaluation(v, r){
  try{ r._word = v.word; }catch(_){}
  state.practiceResult=r; state.practiceError=null;
  recordPractice(v.id, r.score, r.isAcceptable);
  state.tab='result'; render(); document.getElementById('main').scrollTop=0;
}

function contextSentence(v){
  // Câu context có chỗ trống thay cho target (mục B mode 3) — dùng exampleEn nếu chứa từ, else fallback.
  const w=v.word;
  if(v.exampleEn && v.exampleEn.toLowerCase().includes(w.toLowerCase())){
    const re=new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i');
    return { sent:v.exampleEn.replace(re,'______'), vi:v.exampleVi||'' };
  }
  return { sent:`______ — ${v.meaningVi}`, vi:'' };
}
function pickRecallMode(i){ return ['vi2en','en2vi','context'][i%3]; } // xoay vòng 3 mode

// So khớp gần đúng (Levenshtein đơn giản) để chấm ô nhập tự nguyện
function levSimple(a,b){
  if(a===b) return true;
  if(!a||!b) return false;
  const d=[]; for(let i=0;i<=a.length;i++){d[i]=[i];} for(let j=0;j<=b.length;j++){d[0][j]=j;}
  for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++){
    d[i][j]=Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  }
  return d[a.length][b.length] <= Math.max(1, Math.floor(b.length*0.2)); // sai ≤20% ký tự = chấp nhận
}

        return `<div class="note-item">
          <div class="note-body">
            ${n.tag?`<span class="fix-tag" style="margin-bottom:6px">${tagIcon(n.tag)} ${escapeHtml(n.tag)}</span>`:''}
            <div class="note-fix"><span class="bad">${escapeHtml(n.bad)}</span><span class="arw">→</span><span class="good">${escapeHtml(n.good)}</span></div>
            ${n.myNote
              ? `<div class="note-mine">📝 ${escapeHtml(n.myNote)}</div>`
              : (n.reason?`<div class="note-reason">${escapeHtml(n.reason)}</div>`:'')}
            ${n.example?`<div class="note-example">✏️ VD: <i>${escapeHtml(n.example)}</i></div>`:''}
            ${n.sentence?`<div class="note-sent">Câu: "${escapeHtml(n.sentence)}"</div>`:''}
            ${n.word?`<div class="note-word">Từ luyện: <b>${escapeHtml(n.word)}</b></div>`:''}
            <button class="dw-note-edit" onclick="editMyNote('${n.id}')">${n.myNote?'✏️ Sửa ghi chú của bạn':'✏️ Thêm ghi chú của bạn'}</button>
          </div>
          <button class="note-del" title="Xóa" onclick="deleteNote('${n.id}')">${svg(IC.close,15)}</button>
        </div>`;
      }).join('')}
    </div>`;
  }
  return body;
}

function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function startDeck(topicId, startId){
  const all=allVocab().filter(v=>v.topic===topicId);
  if(startId){
    // Mở đúng từ được chọn (từ danh sách/tìm kiếm) — giữ nguyên thứ tự để tìm được vị trí
    state.deck=all; state.deckIdx=Math.max(0, all.findIndex(v=>v.id===startId));
  }else{
    // "Học từ mới": bỏ từ đã học + xáo trộn ngẫu nhiên
    const fresh=shuffle(all.filter(v=>!DATA.learned[v.id]));
    if(fresh.length){
      state.deck=fresh; state.deckIdx=0;
    }else{
      // Đã học hết từ trong chủ đề → cho ôn lại toàn bộ (cũng random) + báo
      toast('🎉 Bạn đã học hết từ mới trong chủ đề này! Giờ ôn lại nhé.');
      state.deck=shuffle(all); state.deckIdx=0;
    }
  }
  state.flip=false; state.tab='flash'; render(); document.getElementById('main').scrollTop=0;
}

// Lấy MỘT đề "khó" khác (mức 2 = Khó) — random trong pool có sẵn, hoặc nhờ AI tạo thêm câu mới khi
// pool còn ít hoặc để tăng đa dạng. Không gọi AI mỗi lần (giảm API calls) — chỉ khi cần.
async function fxNewHardExercise(vid, idx){
  const v = findVocab(vid); if(!v) return;
  const st = fxGet(vid, idx);
  const curPromptVi = st.curEx?.promptVi || getExercises(v)[idx]?.promptVi;
  fxSet(vid, idx, {exLoading:true}); render();
  const pool = hardExercisePool(v);
  const cachedCount = (DATA.generatedExercises && DATA.generatedExercises[vid] || []).length;
  // Ưu tiên gọi AI khi: pool còn ít lựa chọn (<3), hoặc ngẫu nhiên ~50% để tăng đa dạng khi đã có AI
  const wantGenerate = hasKey() && isOnline() && (cachedCount < 3 || Math.random() < 0.5);
  let ex = null;
  if(wantGenerate){
    try{ ex = await generateHardExercise(v); cacheGeneratedExercise(vid, ex); }
    catch(e){ ex = null; } // lỗi AI (hết quota, offline giữa chừng...) → rơi về pool bên dưới
  }
  if(!ex) ex = pickFromPool(pool, curPromptVi);
  fxSet(vid, idx, {exLoading:false, curEx:ex, input:'', result:null, error:null});
  render();
}
function scrollToPractice(){ setTimeout(()=>{ const el=document.querySelector('.practice-inline'); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); },60); }
// Đề đang thực sự hiển thị cho 1 slot (vid,idx): ưu tiên curEx (đã đổi/AI-sinh), else đề mặc định cố định.
function fxCurrentEx(v, idx){ return fxGet(v.id, idx).curEx || getExercises(v)[idx]; }
async function fxEvaluate(vid, idx){
  const v=findVocab(vid); const ex=fxCurrentEx(v, idx);
  const sent=(fxGet(vid,idx).input||'').trim();
  if(!sent){ toast('Hãy nhập câu trước đã'); return; }
  // Không có key hoặc offline → chấm máy luôn (đã có banner báo trước ở UI)
  if(!hasKey()){ const r=gradeLocally(sent,v,ex); fxFinish(vid,idx,v,r); return; }
  if(!isOnline()){ fxSet(vid,idx,{error:'OFFLINE'}); render(); scrollToPractice(); return; }
  fxSet(vid,idx,{loading:true,error:null}); render(); scrollToPractice();
  try{
    const r=await evaluateWithGemini(sent,v,ex);
    fxSet(vid,idx,{loading:false}); fxFinish(vid,idx,v,r);
  }catch(e){
    // KHÔNG âm thầm chấm máy: hiện rõ lý do lỗi + để nút "Chấm bằng máy"
    fxSet(vid,idx,{loading:false, error:e.message||'UNKNOWN'});
    render(); scrollToPractice();
  }
}
function fxGradeLocalNow(vid, idx){
  const v=findVocab(vid); const ex=fxCurrentEx(v, idx);
  const sent=(fxGet(vid,idx).input||'').trim(); if(!sent) return;
  const r=gradeLocally(sent,v,ex); fxSet(vid,idx,{error:null}); fxFinish(vid,idx,v,r);
}
function fxFinish(vid, idx, v, r){
  try{ r._word = v.word; }catch(_){}
  fxSet(vid,idx,{result:r,error:null});

/* ---- TRA TỪ NHANH (Google Translate free) ---- */
// Đoán ngôn ngữ: nếu có ký tự tiếng Việt có dấu → coi là Việt→Anh; ngược lại Anh→Việt.
function guessDir(text){
  return /[àáảãạăằắẳẵặâầấẩẫậèéẻẽẹêềếểễệìíỉĩịòóỏõọôồốổỗộơờớởỡợùúủũụưừứửữựỳýỷỹỵđ]/i.test(text) ? 'vi2en' : 'en2vi';
}
async function gtranslate(text, sl, tl){
  const q=(text||'').trim(); if(!q) throw new Error('EMPTY');
  // Google Translate endpoint công khai (không cần key)
  try{
    const url='https://translate.googleapis.com/translate_a/single?client=gtx&sl='+sl+'&tl='+tl+'&dt=t&q='+encodeURIComponent(q);
    const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(),12000);
    const res=await fetch(url,{signal:ctrl.signal}); clearTimeout(t);
    if(res.ok){
      const data=await res.json();
      if(Array.isArray(data)&&Array.isArray(data[0])){
        const out=data[0].map(s=>s&&s[0]?s[0]:'').join('').trim();
        if(out) return out;
      }
    }
  }catch(_){}
  // Dự phòng: MyMemory
  try{
    const url='https://api.mymemory.translated.net/get?langpair='+sl+'|'+tl+'&q='+encodeURIComponent(q);
    const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(),12000);
    const res=await fetch(url,{signal:ctrl.signal}); clearTimeout(t);
    if(res.ok){ const data=await res.json(); const out=(data?.responseData?.translatedText||'').trim(); if(out) return out; }
  }catch(_){}
  throw new Error('FAIL');
}

  const el=document.getElementById('lookupSheetInput');

    </div>`;
  }catch(e){
    box.innerHTML=`<div class="card-sub" style="margin-top:12px">Không tra được lúc này. Kiểm tra Internet và thử lại.</div>`;
  }
}

function noteFixId(f, sentence){ return 'fx-'+((f.bad||'')+'|'+(f.good||'')+'|'+(sentence||'')).toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,80); }

function saveFixNote(bad, good, tag, reason, example, sentence, word, myNote){
  if(!DATA.notes) DATA.notes=[];
  const f={bad,good}; const id=noteFixId(f,sentence);
  const exist=DATA.notes.findIndex(n=>n.id===id);
  if(exist>=0){ DATA.notes.splice(exist,1); save(); toast('Đã bỏ khỏi Ghi chú'); render(); scrollToPractice(); return; }
  DATA.notes.push({ id, ts:Date.now(), kind:'fix', bad, good, tag:tag||'', reason:reason||'', example:example||'',

  const safe=v=>escapeHtml(v||'');
  showSheet(`<h2>✏️ Ghi chú của bạn</h2>
    <p class="sub">Viết lại theo cách bạn dễ nhớ nhất.</p>
    <div class="card" style="margin:0 0 14px">
      ${n.tag?`<span class="fix-tag">${tagIcon(n.tag)} ${safe(n.tag)}</span>`:''}
      <div class="fix-row" style="margin-top:8px"><span class="bad">${safe(n.bad)}</span><span class="arw">→</span><span class="good">${safe(n.good)}</span></div>
    </div>
    <textarea class="answer-area" id="myNoteEditInput" style="min-height:90px" placeholder="Ví dụ: 'nhớ là she/he/it phải thêm s nha!'">${safe(n.myNote)}</textarea>
    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="btn btn-outline" onclick="closeSheet()">Huỷ</button>
      <button class="btn btn-brand" onclick="saveMyNoteEdit('${noteId}')">💾 Lưu</button>
    </div>`);
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  setTimeout(()=>{ const el=document.getElementById('myNoteEditInput'); if(el) el.focus(); },200);
}
function saveMyNoteEdit(noteId){
  const n=(DATA.notes||[]).find(x=>x.id===noteId); if(!n) return;
  const ta=document.getElementById('myNoteEditInput');
  n.myNote=(ta? ta.value : '').trim();
  save(); closeSheet(); toast('📝 Đã cập nhật ghi chú'); render();
}
function addManualNote(){
  const ta=document.getElementById('manualNoteInput');
  const text=(ta? ta.value : '').trim();
  if(!text){ toast('Hãy nhập nội dung ghi chú'); return; }
  if(!DATA.notes) DATA.notes=[];
  DATA.notes.push({ id:'mn-'+Date.now(), ts:Date.now(), kind:'manual', text });
  save(); if(ta) ta.value=''; toast('📝 Đã thêm ghi chú'); render();
}
function editManualNote(noteId){
  const n=(DATA.notes||[]).find(x=>x.id===noteId); if(!n) return;
  const safe=v=>escapeHtml(v||'');
  showSheet(`<h2>✏️ Sửa ghi chú</h2>
    <textarea class="answer-area" id="manualEditInput" style="min-height:100px">${safe(n.text)}</textarea>
    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="btn btn-outline" onclick="closeSheet()">Huỷ</button>
      <button class="btn btn-brand" onclick="saveManualNoteEdit('${noteId}')">💾 Lưu</button>
    </div>`);
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  setTimeout(()=>{ const el=document.getElementById('manualEditInput'); if(el) el.focus(); },200);
}
function saveManualNoteEdit(noteId){
  const n=(DATA.notes||[]).find(x=>x.id===noteId); if(!n) return;
  const ta=document.getElementById('manualEditInput');
  const text=(ta? ta.value : '').trim();
  if(!text){ toast('Ghi chú không được để trống'); return; }
  n.text=text; save(); closeSheet(); toast('📝 Đã cập nhật'); render();
}
function deleteNote(id){
  DATA.notes=(DATA.notes||[]).filter(n=>n.id!==id);
  save(); render();
}
function dayLabel(ts){
  const d=new Date(ts), now=new Date();
  const strip=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate()).getTime();
  const diff=Math.round((strip(now)-strip(d))/86400000);
  if(diff===0) return 'Hôm nay';
  if(diff===1) return 'Hôm qua';
  const wd=['Chủ nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'][d.getDay()];
  return `${wd}, ${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;
}
function groupNotesByDay(){
  const notes=[...(DATA.notes||[])].sort((a,b)=>b.ts-a.ts);
  const groups=[]; const map={};
  for(const n of notes){
    const key=dayLabel(n.ts);
    if(!map[key]){ map[key]={label:key, items:[]}; groups.push(map[key]); }
    map[key].items.push(n);
  }
  return groups;
}

/* Theme */
function applyTheme(){
  const light = DATA.theme==='light';
  document.documentElement.classList.toggle('light', light);
  document.querySelector('meta[name=theme-color]').setAttribute('content', light?'#f2f4f9':'#0b1020');
}
function toggleTheme(){ DATA.theme = DATA.theme==='light'?'dark':'light'; save(); render(); }

/* FAB */
function toggleFab(){ document.getElementById('fab').classList.toggle('open'); }
function closeFab(){ document.getElementById('fab').classList.remove('open'); }

/* Sheet: Settings + Export/Import (đưa lên sớm vì dữ liệu ở local) */
function openSettings(){
  const keySet = hasKey();
  const body=`<h2>⚙️ Cài đặt</h2><p class="sub">Ứng dụng cá nhân — dữ liệu lưu trên máy bạn.</p>

    <div class="card" style="margin:0 0 12px;border-color:${keySet?'var(--success)':'var(--border)'}">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
        <span class="card-title">✨ AI chấm câu (Gemini)</span>
        <span style="flex:1"></span>
        <span class="chip ${keySet?'':'chip-muted'}" style="${keySet?'background:var(--success-bg);color:var(--success)':''}">${keySet?'Đang bật':'Chưa bật'}</span>
      </div>
      <div class="card-sub" style="margin-bottom:12px">Miễn phí với Gemini free tier. Lấy key tại
        <a class="link" href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener">Google AI Studio</a>,
        dán vào đây. Key chỉ lưu trên máy bạn.</div>
      <input class="key-input" id="geminiKeyInput" type="password" placeholder="Dán Gemini API key (AIza...)"
        value="${escapeHtml(DATA.geminiKey||'')}" />
      <div style="display:flex;gap:8px">
        <button class="btn btn-brand btn-sm" onclick="saveGeminiKey()">Lưu key</button>
        ${keySet?`<button class="btn btn-outline btn-sm" onclick="clearGeminiKey()">Xoá</button>`:''}
      </div>
    </div>

    <div class="card" style="margin:0 0 12px">
      <div class="card-title" style="margin-bottom:10px">Mục tiêu mỗi ngày</div>
      <div style="display:flex;gap:8px">
        ${[5,10,15].map(n=>`<button class="btn ${DATA.dailyGoal===n?'btn-brand':'btn-ghost'} btn-sm" onclick="setGoal(${n})">${n} từ</button>`).join('')}
      </div>
    </div>

    <div class="card" style="margin:0 0 12px">
      <div class="card-title" style="margin-bottom:4px">Số từ mỗi phiên ôn tập</div>
      <div class="card-sub" style="margin-bottom:10px">Phiên ngắn giúp học đều mỗi ngày trong ~5 phút.</div>
      <div style="display:flex;gap:8px">
        ${[5,10,15].map(n=>`<button class="btn ${(DATA.reviewLimit||5)===n?'btn-brand':'btn-ghost'} btn-sm" onclick="setReviewLimit(${n})">${n} từ</button>`).join('')}
      </div>
    </div>

    <div class="card" style="margin:0 0 12px">
      <div class="card-title" style="margin-bottom:6px">Giao diện</div>
      <div style="display:flex;gap:8px">
        <button class="btn ${DATA.theme==='dark'?'btn-brand':'btn-ghost'} btn-sm" onclick="setTheme('dark')">🌙 Tối</button>
        <button class="btn ${DATA.theme==='light'?'btn-brand':'btn-ghost'} btn-sm" onclick="setTheme('light')">☀️ Sáng</button>
      </div>
    </div>

    <div class="card" style="margin:0 0 12px">
      <div class="card-title" style="margin-bottom:4px">Sao lưu & khôi phục</div>
      <div class="card-sub" style="margin-bottom:12px">Xuất file .json để giữ dữ liệu khi đổi máy / xóa trình duyệt.</div>
      <button class="btn btn-outline btn-sm" style="margin-bottom:8px" onclick="exportData()">⬇️ Xuất dữ liệu (backup)</button>
      <button class="btn btn-outline btn-sm" onclick="document.getElementById('importFile').click()">⬆️ Nhập dữ liệu</button>
      <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importData(event)" />
    </div>

    ${!isStandalone()?`<div class="card" style="margin:0 0 12px">
      <div class="card-title" style="margin-bottom:4px">📲 Cài như ứng dụng</div>
      <div class="card-sub" style="margin-bottom:12px">Thêm vào màn hình chính để mở nhanh như app thật, chạy được cả khi offline.</div>
      <button class="btn btn-brand btn-sm" onclick="promptInstall()">Thêm vào màn hình chính</button>
      <div class="card-sub" style="margin-top:8px">iPhone: bấm nút Chia sẻ ⬆️ trong Safari → "Thêm vào MH chính".</div>
    </div>`:''}

    <div class="card" style="margin:0 0 12px">
      <div class="card-title" style="margin-bottom:8px">Về ứng dụng</div>
      <div class="card-sub" style="line-height:1.6">English Coach · phiên bản MVP (1.0)<br>
        Triết lý: <b style="color:var(--ink)">Biết từ chưa đủ — phải dùng được từ.</b><br>
        Ứng dụng cá nhân, dữ liệu ở máy bạn, không tài khoản, không quảng cáo.</div>
    </div>

    <button class="btn btn-outline btn-sm" style="color:var(--danger)" onclick="resetAll()">🗑️ Xóa toàn bộ tiến độ</button>`;
  showSheet(body);
}
function setGoal(n){ DATA.dailyGoal=n; save(); openSettings(); render(); }
function setReviewLimit(n){ DATA.reviewLimit=n; save(); openSettings(); render(); }
function setTheme(t){ DATA.theme=t; save(); openSettings(); render(); }
function saveGeminiKey(){
  const el=document.getElementById('geminiKeyInput'); const k=(el?.value||'').trim();
  DATA.geminiKey=k; save(); openSettings(); render();
  toast(k? 'Đã lưu key ✓ AI đã bật':'Đã xoá key');
}
function clearGeminiKey(){ DATA.geminiKey=''; save(); openSettings(); render(); toast('Đã xoá key'); }
function exportData(){
  const blob=new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='english-coach-backup.json'; a.click(); URL.revokeObjectURL(a.href);
  toast('Đã xuất backup ✓');
}
function importData(e){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ DATA={...defaultData(),...JSON.parse(r.result)}; save(); closeSheet(); render(); toast('Đã khôi phục dữ liệu ✓'); }
    catch(err){ toast('File không hợp lệ'); } };
  r.readAsText(f);
}
function resetAll(){
  if(confirm('Xóa toàn bộ tiến độ học? Không thể hoàn tác.')){ DATA=defaultData(); save(); closeSheet(); render(); toast('Đã reset'); }
}

function showSheet(html){ document.getElementById('sheetBody').innerHTML=html;
  document.getElementById('overlay').classList.add('show'); document.getElementById('sheet').classList.add('show'); }
function closeSheet(){ document.getElementById('overlay').classList.remove('show'); document.getElementById('sheet').classList.remove('show'); }

/* Toast */
let toastT;
function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),1900); }

/* utils */
function escq(s){ return String(s).replace(/'/g,"\\'").replace(/"/g,'&quot;'); }
function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* =================================================================
   PWA — single-file build.
   Manifest + apple meta + Add to Home Screen đủ để cài như app.
   (Service worker cần file .js riêng cùng origin nên bỏ ở bản 1-file;
   app vẫn chạy offline vì toàn bộ nằm trong 1 file đã tải, dữ liệu ở
   localStorage. Chỉ AI cần Internet.)
================================================================= */
// Add to Home Screen (Android/Chrome)
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); deferredPrompt=e; });
async function promptInstall(){
  if(!deferredPrompt){ toast('iPhone: bấm Chia sẻ ⬆️ → "Thêm vào MH chính"'); return; }
  deferredPrompt.prompt();
  try{ await deferredPrompt.userChoice; }catch(e){}
  deferredPrompt=null; openSettings();
}
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true;

/* boot */
window.addEventListener('online',()=>{ if(state.tab==='practice') render(); });
window.addEventListener('offline',()=>{ if(state.tab==='practice') render(); });
render();
</script>
