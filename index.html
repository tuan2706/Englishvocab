<title>English Coach — Use it, don't just memorize</title>
<style>
/* =================================================================
   TOKENS — Design DNA (dark premium, 1 brand color)
================================================================= */
:root{
  --bg:#0e0e10;--surface:#1a1a22;--surface-2:#232330;
  --border:rgba(255,255,255,.06);--border-strong:rgba(255,255,255,.14);
  --ink:#fff;--muted:#a1a1aa;
  --brand:#3d8bfd;--brand-light:rgba(61,139,253,.16);--brand-glow:rgba(61,139,253,.35);
  --success:#34d399;--success-bg:rgba(52,211,153,.14);
  --danger:#ff5c5c;--danger-bg:rgba(255,92,92,.14);
  --warn:#ffab3d;--warn-bg:rgba(255,171,61,.14);
  --glass-bg:rgba(26,26,34,.72);--glass-border:rgba(255,255,255,.08);
  --r-card:1.5rem;--r-btn:1rem;
  --sh-card:0 8px 24px -8px rgba(0,0,0,.35),0 2px 8px -2px rgba(0,0,0,.25);
  --sh-float:0 12px 40px -8px rgba(0,0,0,.5);
  --sh-glow:0 8px 28px -4px var(--brand-glow);
  color-scheme:dark;
}
html.light{
  --bg:#f4f5f7;--surface:#fff;--surface-2:#eceef2;
  --border:rgba(15,15,20,.07);--border-strong:rgba(15,15,20,.14);
  --ink:#101014;--muted:#6b6b76;
  --brand:#2f6fe4;--brand-light:rgba(47,111,228,.1);--brand-glow:rgba(47,111,228,.25);
  --success:#0f9d6b;--success-bg:rgba(15,157,107,.1);
  --danger:#d63b3b;--danger-bg:rgba(214,59,59,.1);
  --warn:#c67608;--warn-bg:rgba(198,118,8,.1);
  --glass-bg:rgba(255,255,255,.82);--glass-border:rgba(15,15,20,.06);
  color-scheme:light;
}
*{box-sizing:border-box;border-color:var(--border);-webkit-tap-highlight-color:transparent}
html,body{margin:0;overscroll-behavior-y:none}
body{
  background:#050506;color:var(--ink);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex;justify-content:center;align-items:flex-start;min-height:100vh;
}
h1,h2,h3{letter-spacing:-.02em;margin:0}
.tabular{font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}

/* App shell */
.app{position:relative;width:100%;max-width:430px;min-height:100vh;background:var(--bg)}
@media(min-width:470px){
  .app{min-height:calc(100vh - 48px);margin:24px 0;border-radius:2.75rem;overflow:hidden;
    border:1px solid rgba(255,255,255,.1);
    box-shadow:0 0 0 10px rgba(255,255,255,.02),0 40px 80px -20px rgba(0,0,0,.7)}
}
.main{min-height:100vh;overflow-y:auto;padding:22px 16px 132px}

/* Header */
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:20px}
.phead .desc{font-size:13px;color:var(--muted);margin:0 0 3px}
.phead h1{font-size:25px;font-weight:700}
.icon-btn{width:40px;height:40px;border-radius:999px;display:flex;align-items:center;justify-content:center;
  background:var(--surface);border:1px solid var(--border);font-size:17px;flex:none}
.icon-btn:active{transform:scale(.94)}

/* Card */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);
  box-shadow:var(--sh-card);padding:18px;margin-bottom:14px}
.card-title{font-size:15px;font-weight:600}
.card-sub{font-size:13px;color:var(--muted);margin-top:2px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;
  border-radius:var(--r-btn);font-size:14px;font-weight:600;transition:filter .15s,transform .1s;width:100%}
.btn:active{transform:scale(.97)}
.btn-brand{background:var(--brand);color:#fff;box-shadow:var(--sh-glow)}
.btn-brand:hover{filter:brightness(1.1)}
.btn-outline{border:1px solid var(--border-strong);background:transparent;color:var(--ink)}
.btn-ghost{background:var(--surface-2);color:var(--ink)}
.btn-sm{min-height:38px;font-size:13px;padding:0 14px;border-radius:.75rem}

/* Chips / badges */
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:999px;font-size:12px;
  font-weight:600;background:var(--brand-light);color:var(--brand);white-space:nowrap}
.chip-muted{background:var(--surface-2);color:var(--muted)}
.chip-lvl{background:var(--warn-bg);color:var(--warn)}

/* Stats */
.stat-row{display:flex;gap:10px;margin-bottom:14px}
.stat{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:1.1rem;padding:13px 12px}
.stat .n{font-size:21px;font-weight:700;line-height:1}
.stat .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:6px}

/* Progress */
.progress{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--brand);border-radius:999px;transition:width .5s cubic-bezier(.16,1,.3,1)}

/* Search */
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-btn);padding:0 14px;height:46px;margin-bottom:16px}
.search input{flex:1;background:none;border:none;outline:none;color:var(--ink);font-size:14px}
.search input::placeholder{color:var(--muted)}

/* Topic row */
.topic{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-card);box-shadow:var(--sh-card);padding:16px;margin-bottom:12px;width:100%;text-align:left}
.topic:active{transform:scale(.98)}
.topic .emo{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-size:23px;background:var(--brand-light);flex:none}
.topic .body{flex:1;min-width:0}
.topic .t{font-size:15px;font-weight:600}
.topic .meta{font-size:12px;color:var(--muted);margin:3px 0 8px}
.topic .arrow{color:var(--muted);font-size:18px;flex:none}

/* Vocab list item */
.vitem{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--border);width:100%;text-align:left}
.vitem:last-child{border-bottom:none}
.vitem .w{font-size:15px;font-weight:600}
.vitem .m{font-size:13px;color:var(--muted);margin-top:2px}
.vitem .dot{width:9px;height:9px;border-radius:999px;flex:none;background:var(--surface-2)}
.vitem .dot.learned{background:var(--success)}

/* Flashcard */
.flash{perspective:1400px;height:340px;margin-bottom:18px}
.flash-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.16,1,.3,1);
  transform-style:preserve-3d;cursor:pointer}
.flash.flipped .flash-inner{transform:rotateY(180deg)}
.flash-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:var(--r-card);border:1px solid var(--border);background:var(--surface);box-shadow:var(--sh-card);
  display:flex;flex-direction:column;padding:22px;overflow:hidden}
.flash-front{align-items:center;justify-content:center;text-align:center;gap:6px}
.flash-front .word{font-size:30px;font-weight:700;line-height:1.15}
.flash-front .ipa{font-size:15px;color:var(--muted);margin-top:4px}
.flash-front .tap{position:absolute;bottom:18px;font-size:12px;color:var(--muted);letter-spacing:.03em}
.flash-back{transform:rotateY(180deg);gap:14px;overflow-y:auto}
.flash-back .sec .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;margin-bottom:4px}
.flash-back .sec .en{font-size:15px;line-height:1.5}
.flash-back .sec .vi{font-size:16px;font-weight:600;color:var(--brand)}
.flash-back .sec .ex{font-size:14px;line-height:1.5;font-style:italic}
.coll{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}

.deck-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.deck-count{font-size:13px;color:var(--muted);font-weight:600}

/* Continue card special */
.cont{background:linear-gradient(135deg,var(--brand),color-mix(in srgb,var(--brand) 55%,#7c3aed));
  border:none;color:#fff;border-radius:var(--r-card);padding:20px;box-shadow:var(--sh-glow);margin-bottom:14px;
  width:100%;text-align:left}
.cont:active{transform:scale(.98)}
.cont .k{font-size:12px;opacity:.85;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.cont .v{font-size:20px;font-weight:700;margin:6px 0 4px}
.cont .p{font-size:12.5px;opacity:.9;margin-bottom:12px}
.cont .bar{height:7px;background:rgba(255,255,255,.25);border-radius:999px;overflow:hidden}
.cont .bar>i{display:block;height:100%;background:#fff;border-radius:999px}

/* Quick actions */
.qa{display:flex;gap:10px}
.qa button{flex:1;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--border);
  border-radius:1.1rem;padding:14px 8px;font-size:12px;font-weight:600;box-shadow:var(--sh-card)}
.qa button:active{transform:scale(.96)}
.qa button .e{font-size:20px}

/* Section label */
.slabel{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;
  margin:22px 4px 12px}

/* Bottom nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));
  width:100%;max-width:430px;padding:0 16px;z-index:30}
.nav-inner{display:flex;justify-content:space-around;align-items:center;border-radius:1.6rem;padding:8px;box-shadow:var(--sh-float)}
.nav a{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;
  font-size:10px;font-weight:500;color:var(--muted);border-radius:1rem;transition:color .2s}
.nav a.active{color:var(--brand)}
.nav a .ico{width:22px;height:22px}
.nav a .hl{position:absolute;inset:2px 10px;border-radius:1rem;background:var(--brand-light);z-index:-1;opacity:0;transition:opacity .25s}
.nav a.active .hl{opacity:1}

/* FAB */
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));
  width:100%;max-width:430px;z-index:40;pointer-events:none}
.fab-btn{position:absolute;right:16px;bottom:0;width:56px;height:56px;border-radius:999px;background:var(--brand);
  color:#fff;box-shadow:var(--sh-glow);display:flex;align-items:center;justify-content:center;font-size:26px;
  pointer-events:auto;transition:transform .3s cubic-bezier(.16,1,.3,1)}
.fab-btn:active{transform:scale(.92)}
.fab.open .fab-btn{transform:rotate(45deg)}
.fab-menu{position:absolute;right:16px;bottom:70px;display:flex;flex-direction:column;align-items:flex-end;gap:12px;pointer-events:none}
.fab.open .fab-menu{pointer-events:auto}
.fab-item{display:flex;align-items:center;gap:12px;opacity:0;transform:translateY(12px) scale(.9);
  transition:all .25s cubic-bezier(.16,1,.3,1)}
.fab.open .fab-item{opacity:1;transform:none}
.fab.open .fab-item:nth-child(1){transition-delay:.02s}
.fab.open .fab-item:nth-child(2){transition-delay:.05s}
.fab.open .fab-item:nth-child(3){transition-delay:.08s}
.fab-item .lbl{background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:7px 13px;
  font-size:13px;font-weight:600;box-shadow:var(--sh-float)}
.fab-item .dot{width:44px;height:44px;border-radius:999px;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:18px;box-shadow:var(--sh-float)}

/* Bottom sheet */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(2px);z-index:50;opacity:0;
  pointer-events:none;transition:opacity .25s}
.overlay.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%) translateY(100%);width:100%;max-width:430px;
  max-height:88vh;overflow-y:auto;background:var(--surface);border-radius:2rem 2rem 0 0;border-top:1px solid var(--border);
  box-shadow:var(--sh-float);z-index:51;padding:12px 20px calc(24px + env(safe-area-inset-bottom));
  transition:transform .32s cubic-bezier(.16,1,.3,1)}
.sheet.show{transform:translateX(-50%) translateY(0)}
.sheet .handle{width:40px;height:5px;border-radius:999px;background:var(--border-strong);margin:0 auto 14px}
.sheet h2{font-size:19px;font-weight:700;margin-bottom:4px}
.sheet .sub{font-size:14px;color:var(--muted);margin-bottom:18px}

/* Empty state */
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .e{font-size:40px;margin-bottom:10px}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(160px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:var(--surface);border:1px solid var(--border-strong);border-radius:999px;padding:10px 18px;font-size:13px;
  font-weight:600;box-shadow:var(--sh-float);z-index:60;opacity:0;pointer-events:none;transition:all .3s;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Practice */
/* Phase 3 — AI */
.ai-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11px;
  font-weight:700;background:linear-gradient(135deg,var(--brand),#a855f7);color:#fff}
.local-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11px;
  font-weight:600;background:var(--surface-2);color:var(--muted)}
.spin{width:20px;height:20px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:999px;
  display:inline-block;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:16px;color:var(--muted)}
.loading-wrap .spin{width:34px;height:34px;border-color:var(--surface-2);border-top-color:var(--brand)}
.banner{display:flex;align-items:center;gap:10px;background:var(--warn-bg);border:1px solid var(--warn);
  border-radius:1rem;padding:11px 14px;font-size:13px;color:var(--ink);margin-bottom:14px;line-height:1.5}
.err-card{background:var(--danger-bg);border:1px solid var(--danger);border-radius:var(--r-card);padding:18px;text-align:center}
.err-card .e{font-size:34px;margin-bottom:8px}
.key-input{width:100%;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:.75rem;
  padding:11px 13px;color:var(--ink);font-size:13px;outline:none;font-family:monospace;margin-bottom:10px}
.key-input:focus{border-color:var(--brand)}
.link{color:var(--brand);text-decoration:underline;font-weight:600}

/* Practice inline dưới flashcard */
.practice-inline{margin-top:8px}
.practice-inline .head{display:flex;align-items:center;gap:8px;margin:22px 4px 12px}
.practice-inline .head .t{font-size:15px;font-weight:700}
.ex-tabs{display:flex;gap:8px;margin-bottom:12px}
.ex-tab{flex:1;padding:9px 6px;border-radius:.75rem;background:var(--surface-2);color:var(--muted);
  font-size:13px;font-weight:600;text-align:center;border:1px solid transparent;transition:all .2s}
.ex-tab.active{background:var(--brand-light);color:var(--brand);border-color:var(--brand)}
.ex-tab.done{color:var(--success)}
.mini-result{border-radius:1rem;padding:14px;margin-top:12px;border:1px solid var(--border)}
.mini-result .top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.mini-result .sc{font-size:26px;font-weight:800;line-height:1}
.mini-result .fixes{margin-top:8px}
.mini-fb{font-size:13px;line-height:1.6;margin-top:4px}

/* Mức độ đề + gợi ý từ */
.lvl-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700}
.lvl-medium{background:var(--success-bg);color:var(--success)}
.lvl-good{background:var(--warn-bg);color:var(--warn)}
.lvl-hard{background:var(--danger-bg);color:var(--danger)}
.hint-panel{background:var(--surface-2);border:1px solid var(--border);border-radius:1rem;padding:14px;margin:12px 0}
.hint-panel .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;margin-bottom:10px}
.hint-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.hint-item:last-child{border-bottom:none}
.hint-item .en{font-weight:600;font-size:14px}
.hint-item .vi{font-size:12px;color:var(--muted)}
.hint-item .acts{display:flex;gap:6px;flex:none}
.hint-btn{width:34px;height:34px;border-radius:.6rem;display:flex;align-items:center;justify-content:center;
  background:var(--surface);border:1px solid var(--border-strong);font-size:15px}
.hint-btn:active{transform:scale(.9)}
.hint-btn.saved{background:var(--brand);color:#fff;border-color:var(--brand)}

.target-box{background:var(--brand-light);border:1px solid var(--brand);border-radius:var(--r-card);
  padding:18px;text-align:center;margin-bottom:14px}
.target-box .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--brand);font-weight:600;margin-bottom:8px}
.target-box .w{font-size:24px;font-weight:700;color:var(--ink);line-height:1.2}
.prompt-vi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);
  padding:16px;margin-bottom:14px;box-shadow:var(--sh-card)}
.prompt-vi .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;margin-bottom:8px}
.prompt-vi .txt{font-size:16px;line-height:1.5;font-weight:500}
.answer-area{width:100%;min-height:110px;background:var(--surface);border:1px solid var(--border-strong);
  border-radius:var(--r-card);padding:16px;color:var(--ink);font-size:15px;line-height:1.6;resize:none;
  outline:none;margin-bottom:14px;font-family:inherit}
.answer-area:focus{border-color:var(--brand)}
.answer-area::placeholder{color:var(--muted)}

/* Result */
.score-ring{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px 0 4px}
.score-ring .num{font-size:52px;font-weight:800;line-height:1}
.score-ring .verdict{font-size:16px;font-weight:600;margin-top:6px}
.breakdown{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.bk{background:var(--surface-2);border-radius:1rem;padding:12px 14px}
.bk .k{font-size:12px;color:var(--muted);margin-bottom:6px}
.bk .v{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600}
.bar-mini{height:6px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;margin-top:8px}
html.light .bar-mini{background:rgba(0,0,0,.08)}
.bar-mini>i{display:block;height:100%;border-radius:999px}
.fix-row{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:14px}
.fix-row .bad{color:var(--danger);text-decoration:line-through;opacity:.8}
.fix-row .good{color:var(--success);font-weight:600}
.fix-reason{font-size:12px;color:var(--muted);margin:2px 0 8px 2px;line-height:1.5}
.corrected-box{background:var(--surface-2);border:1px solid var(--border);border-radius:1rem;padding:12px 14px;margin-top:10px}
.corrected-box .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;margin-bottom:6px}
.corrected-box .txt{font-size:14px;line-height:1.6}
.best-box{background:var(--brand-light);border:1px solid var(--brand);border-radius:1rem;padding:12px 14px;margin-top:10px}
.best-box .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--brand);font-weight:700;margin-bottom:6px}
.best-box .txt{font-size:15px;line-height:1.55;font-weight:500;color:var(--ink)}
.best-box .acts{display:flex;gap:8px;margin-top:10px}
.hl-change{background:var(--success-bg);color:var(--success);border-radius:4px;padding:0 3px;font-weight:600}
.natural{background:var(--success-bg);border:1px solid var(--success);border-radius:var(--r-card);padding:14px;margin-top:4px}
.natural .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--success);font-weight:600;margin-bottom:6px}
.natural .txt{font-size:15px;line-height:1.5}
.struggle{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--border)}
.struggle:last-child{border-bottom:none}
.struggle .sig{font-size:16px}

.fade{animation:fade .3s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
::-webkit-scrollbar{width:0}
</style>
</head>

/* =================================================================
   STORAGE LAYER — localStorage, đơn giản, có default an toàn
================================================================= */
const KEY = 'english-coach-v1';
const todayStr = () => new Date().toISOString().slice(0,10);
const defaultData = () => ({
  learned:{},            // { vocabId: {ts, box} }
  reviewQueue:{},        // { vocabId: nextReviewDate }
  dailyGoal:5,
  progressToday:{ date:todayStr(), count:0 },
  streak:{ count:0, lastDay:null },
  sentencesPracticed:0,
  practiceScores:[],      // [{ts, score}] để tính điểm luyện trung bình
  mistakes:{},            // { vocabId: count } — "Words I struggle with"
  myWords:[],             // [{id, word, meaningVi, ts}] — từ tự lưu khi luyện
  theme:'dark',
  geminiKey:'',
});
let DATA = load();
function load(){
  try{ const raw=localStorage.getItem(KEY); if(!raw) return defaultData();
    return { ...defaultData(), ...JSON.parse(raw) }; }
  catch(e){ return defaultData(); }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(DATA)); }catch(e){} }

function markLearned(id){
  const first = !DATA.learned[id];
  DATA.learned[id] = { ts:Date.now(), box:(DATA.learned[id]?.box||0)+1 };
  if(first){ bumpDaily(); }
  bumpStreak();
  save();
}
function bumpDaily(){
  if(DATA.progressToday.date!==todayStr()) DATA.progressToday={date:todayStr(),count:0};
  DATA.progressToday.count++;
}
function bumpStreak(){
  const t=todayStr();
  if(DATA.streak.lastDay===t) return;
  const yest=new Date(Date.now()-864e5).toISOString().slice(0,10);
  DATA.streak.count = (DATA.streak.lastDay===yest)? DATA.streak.count+1 : 1;
  DATA.streak.lastDay=t;
}
const learnedCount = () => Object.keys(DATA.learned).length;
// Kho từ đầy đủ = VOCAB cố định + "Từ của tôi" (động, do người dùng lưu)
function myWordsAsVocab(){
  return (DATA.myWords||[]).map(w=>({
    id:w.id, topic:'mywords', word:w.word, type:w.type||'', level:w.level||'',
    meaningVi:w.meaningVi||'', definitionEn:w.definitionEn||'',
    pronunciation:w.pronunciation||'', exampleEn:w.exampleEn||'', exampleVi:w.exampleVi||'',
    collocations:w.collocations||[],
    targetExercises:[{ promptVi:'Hãy tự đặt một câu tiếng Anh có dùng "'+w.word+'".', targetPhrase:w.word }],
    _mine:true,
  }));
}
function allVocab(){ return VOCAB.concat(myWordsAsVocab()); }
const findVocab = id => allVocab().find(v=>v.id===id);
const topicLearned = tid => allVocab().filter(v=>v.topic===tid && DATA.learned[v.id]).length;
const topicTotal   = tid => allVocab().filter(v=>v.topic===tid).length;

function recordPractice(vocabId, score, passed){
  DATA.sentencesPracticed = (DATA.sentencesPracticed||0)+1;
  DATA.practiceScores = (DATA.practiceScores||[]).concat({ ts:Date.now(), score }).slice(-100);
  if(!passed){ DATA.mistakes[vocabId] = (DATA.mistakes[vocabId]||0)+1; }
  else if(DATA.mistakes[vocabId]){ DATA.mistakes[vocabId] = Math.max(0, DATA.mistakes[vocabId]-1); if(!DATA.mistakes[vocabId]) delete DATA.mistakes[vocabId]; }
  bumpStreak();
  save();
}
const avgPracticeScore = () => {
  const s=(DATA.practiceScores||[]); if(!s.length) return 0;
  return Math.round(s.reduce((a,b)=>a+b.score,0)/s.length);
};
const struggleList = () => Object.entries(DATA.mistakes||{})
  .map(([id,c])=>({ v:findVocab(id), count:c })).filter(x=>x.v)
  .sort((a,b)=>b.count-a.count);

/* =================================================================
   SPEECH LAYER — Web Speech API, fail gracefully
================================================================= */
function speak(text){
  if(!('speechSynthesis' in window)){ toast('Trình duyệt không hỗ trợ đọc'); return; }
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-US'; u.rate=.92;
    speechSynthesis.speak(u);
  }catch(e){ toast('Không phát được âm thanh'); }
}

/* =================================================================
   AI LAYER — Gemini free tier (gemini-2.0-flash).
   Key lưu localStorage (app cá nhân). Ép model trả JSON đúng format.
   Nếu lỗi/offline/không key → ném lỗi để caller fallback về chấm cục bộ.
================================================================= */
const GEMINI_MODEL = 'gemini-3.5-flash';
function hasKey(){ return !!(DATA.geminiKey && DATA.geminiKey.trim()); }
function isOnline(){ return navigator.onLine !== false; }
// Tương thích ngược + tự gán mức độ theo vị trí đề (1=medium,2=good,3=hard)
const EX_LEVELS = ['medium','good','hard'];
const LEVEL_VI = { medium:'Trung bình', good:'Khá', hard:'Khó' };
function getExercises(v){
  let list = Array.isArray(v.targetExercises)? v.targetExercises
           : (v.targetExercise? [v.targetExercise] : []);
  return list.map((ex,i)=>({ ...ex, level: ex.level || EX_LEVELS[Math.min(i,2)] }));
}

function buildPrompt(sentence, vocab, ex){
  ex = ex || getExercises(vocab)[0] || {targetPhrase:vocab.word, promptVi:''};
  return `Bạn là giáo viên tiếng Anh giàu kinh nghiệm, dạy người Việt. Hãy chấm và CHỮA câu tiếng Anh do học viên viết.

TỪ/CỤM MỤC TIÊU (bắt buộc phải xuất hiện trong câu): "${ex.targetPhrase}"
GỢI Ý NGHĨA (tiếng Việt) mà học viên cần diễn đạt: "${ex.promptVi}"
CÂU HỌC VIÊN VIẾT: "${sentence}"

Hãy chấm theo 5 tiêu chí, mỗi tiêu chí 0-100:
- meaningScore: có truyền đạt đúng ý câu tiếng Việt không (chấp nhận cách diễn đạt khác, KHÔNG so khớp từng chữ).
- grammarScore: ngữ pháp đúng không.
- vocabularyScore: dùng từ phù hợp; nếu KHÔNG dùng cụm mục tiêu thì tối đa 30.
- naturalnessScore: có tự nhiên như người bản ngữ không.
- score: điểm tổng 0-100 (nếu thiếu cụm mục tiêu thì tối đa 55).

QUAN TRỌNG — hãy làm thật kỹ 3 việc sau:

1) SỬA LỖI CHI TIẾT (mảng "fixes"): liệt kê TỪNG lỗi cụ thể trong câu học viên. Mỗi lỗi gồm:
   - "bad": đúng phần sai trong câu gốc (từ/cụm sai, không chép cả câu),
   - "good": phần đã sửa đúng,
   - "reason": giải thích NGẮN bằng tiếng Việt VÌ SAO sai và quy tắc đúng (vd "động từ số ít cần thêm s", "cần mạo từ 'the' trước danh từ xác định", "sai giới từ: dùng 'on' thay 'in'").
   Chú ý lỗi phổ biến của người Việt: thiếu a/an/the, sai số ít/nhiều, sai giới từ, sai thì, dịch word-by-word, sai trật tự từ, sai collocation, chia động từ theo chủ ngữ, nhầm affect/effect, advice/advise, say/tell. Nếu câu KHÔNG có lỗi thì "fixes" là mảng rỗng.

2) CÂU ĐÃ SỬA (correctedSentence): viết lại CHÍNH câu của học viên sau khi sửa hết lỗi ngữ pháp/chính tả/giới từ, GIỮ nguyên ý và cách diễn đạt của họ nhiều nhất có thể (chỉ sửa chỗ sai). Vẫn phải chứa cụm mục tiêu.

3) CÂU MẪU TỐT NHẤT (bestVersion): tự đặt MỘT câu tiếng Anh hoàn chỉnh, đúng ngữ pháp, tự nhiên như người bản ngữ, hay nhất mà bạn đề xuất cho đề bài này — bắt buộc dùng cụm mục tiêu "${ex.targetPhrase}". Đây là câu mẫu để học viên học theo.

Feedback và mọi giải thích PHẢI bằng tiếng Việt, rõ ràng, cụ thể.

CHỈ trả về JSON thuần (không markdown, không chữ nào ngoài JSON) đúng cấu trúc:
{
  "score": <int>,
  "meaningScore": <int>,
  "grammarScore": <int>,
  "vocabularyScore": <int>,
  "naturalnessScore": <int>,
  "targetWordUsed": <true|false>,
  "isAcceptable": <true|false>,
  "originalSentence": "<câu gốc của học viên, giữ nguyên>",
  "correctedSentence": "<câu của học viên ĐÃ SỬA hết lỗi>",
  "fixes": [ { "bad": "<phần sai>", "good": "<sửa đúng>", "reason": "<vì sao, tiếng Việt>" } ],
  "feedback": [ "<nhận xét tiếng Việt>", "..." ],
  "explanationVi": "<giải thích tổng quan bằng tiếng Việt>",
  "bestVersion": "<câu mẫu tiếng Anh hoàn chỉnh và hay nhất, có cụm mục tiêu>"
}`;
}

async function evaluateWithGemini(sentence, vocab, ex){
  if(!hasKey()) throw new Error('NO_KEY');
  if(!isOnline()) throw new Error('OFFLINE');
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${encodeURIComponent(DATA.geminiKey.trim())}`;
  const body = {
    contents:[{ parts:[{ text: buildPrompt(sentence, vocab, ex) }] }],
    generationConfig:{ temperature:0.3, responseMimeType:'application/json' }
  };
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), 20000);
  let res;
  try{
    res = await fetch(url,{ method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body), signal:ctrl.signal });
  }catch(e){ clearTimeout(timer); throw new Error(e.name==='AbortError'?'TIMEOUT':'NETWORK'); }
  clearTimeout(timer);
  if(!res.ok){
    // đọc nội dung lỗi để phân loại chính xác (Google hay trả 400 cho nhiều nguyên nhân)
    let emsg='';
    try{ const ej=await res.json(); emsg=(ej?.error?.message||ej?.error?.status||'')+''; }catch(_){}
    const lm=emsg.toLowerCase();
    if(res.status===404 || lm.includes('not found') || lm.includes('is not supported') || lm.includes('not supported for') || lm.includes('unknown model')) throw new Error('MODEL_NOT_FOUND');
    if(res.status===401||res.status===403 || lm.includes('api key') || lm.includes('api_key') || lm.includes('permission')) throw new Error('BAD_KEY');
    if(res.status===429 || lm.includes('quota') || lm.includes('rate limit') || lm.includes('resource_exhausted')) throw new Error('RATE_LIMIT');
    if(res.status===400) throw new Error('BAD_KEY'); // 400 còn lại thường do key
    if(res.status>=500) throw new Error('SERVER');
    throw new Error('HTTP_'+res.status);
  }
  const data = await res.json();
  let text = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
  text = text.replace(/```json|```/g,'').trim();
  let json;
  try{ json = JSON.parse(text); }
  catch(e){ const m=text.match(/\{[\s\S]*\}/); if(m){ try{ json=JSON.parse(m[0]); }catch(_){}} }
  if(!json || typeof json.score!=='number') throw new Error('PARSE');
  // chuẩn hoá + đảm bảo đủ trường
  const best = json.bestVersion || json.moreNaturalVersion || '';
  return {
    score: clampInt(json.score), meaningScore: clampInt(json.meaningScore),
    grammarScore: clampInt(json.grammarScore), vocabularyScore: clampInt(json.vocabularyScore),
    naturalnessScore: clampInt(json.naturalnessScore),
    targetWordUsed: !!json.targetWordUsed,
    isAcceptable: json.isAcceptable!==undefined? !!json.isAcceptable : (json.score>=70 && !!json.targetWordUsed),
    originalSentence: json.originalSentence || sentence,
    correctedSentence: json.correctedSentence || sentence,
    fixes: Array.isArray(json.fixes)? json.fixes.filter(f=>f&&f.bad&&f.good).map(f=>({bad:f.bad,good:f.good,reason:f.reason||''})).slice(0,8) : [],
    feedback: Array.isArray(json.feedback)? json.feedback.filter(Boolean).slice(0,6) : [],
    explanationVi: json.explanationVi || '',
    bestVersion: best,
    moreNaturalVersion: best, // giữ tương thích UI cũ
    _local: false,
  };
}
function clampInt(n){ n=Math.round(Number(n)||0); return Math.max(0,Math.min(100,n)); }

/* Gợi ý từ/cụm tiếng Anh giúp đặt câu (kèm nghĩa VN). AI nếu có key, else cục bộ. */
async function suggestWordsAI(vocab, ex){
  if(!hasKey() || !isOnline()) throw new Error('NO_AI');
  const url=`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${encodeURIComponent(DATA.geminiKey.trim())}`;
  const prompt=`Học viên người Việt cần viết câu tiếng Anh sau: "${ex.promptVi}" (bắt buộc dùng "${ex.targetPhrase}").
Gợi ý 5-6 từ hoặc cụm từ tiếng Anh HỮU ÍCH để viết câu này (động từ, danh từ, cụm collocation phù hợp ngữ cảnh, KHÔNG lặp lại chính "${ex.targetPhrase}").
CHỈ trả JSON thuần: {"words":[{"en":"<từ/cụm tiếng Anh>","vi":"<nghĩa tiếng Việt ngắn>"}]}`;
  const ctrl=new AbortController(); const timer=setTimeout(()=>ctrl.abort(),15000);
  let res;
  try{ res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:0.4,responseMimeType:'application/json'}}),
    signal:ctrl.signal}); }
  catch(e){ clearTimeout(timer); throw new Error('NET'); }
  clearTimeout(timer);
  if(!res.ok){ if(res.status===400||res.status===403) throw new Error('BAD_KEY'); throw new Error('HTTP'); }
  const data=await res.json();
  let text=(data?.candidates?.[0]?.content?.parts?.[0]?.text||'').replace(/```json|```/g,'').trim();
  let json; try{ json=JSON.parse(text); }catch(e){ const m=text.match(/\{[\s\S]*\}/); if(m) json=JSON.parse(m[0]); }
  const arr=(json&&json.words)||[];
  return arr.filter(w=>w&&w.en).map(w=>({en:String(w.en).trim(), vi:String(w.vi||'').trim()})).slice(0,6);
}
// Gợi ý cục bộ: collocations + từ trong ví dụ + bộ từ nối hữu ích chung (không cần mạng)
const GENERIC_HINTS = [
  {en:'in order to', vi:'để mà, nhằm'},
  {en:'as well as', vi:'cũng như'},
  {en:'make sure', vi:'đảm bảo'},
  {en:'provide', vi:'cung cấp'},
  {en:'improve', vi:'cải thiện'},
  {en:'reduce', vi:'giảm'},
  {en:'according to', vi:'theo như'},
  {en:'be able to', vi:'có thể'},
];
function suggestWordsLocal(vocab, ex){
  const out=[]; const seen=new Set([ (ex.targetPhrase||'').toLowerCase() ]);
  (vocab.collocations||[]).forEach(c=>{ const k=c.toLowerCase(); if(!seen.has(k)){ seen.add(k); out.push({en:c, vi:''}); } });
  const stop=new Set('the a an to of in on for and or with is are be we our you your it that this needs need every will can may as at by from'.split(' '));
  (vocab.exampleEn||'').replace(/[^a-zA-Z\s-]/g,'').split(/\s+/).forEach(w=>{
    const k=w.toLowerCase(); if(w.length>3 && !stop.has(k) && !seen.has(k)){ seen.add(k); out.push({en:w.toLowerCase(), vi:''}); }
  });
  // luôn bổ sung vài từ nối chung để đủ gợi ý
  for(const g of GENERIC_HINTS){ if(out.length>=6) break; if(!seen.has(g.en.toLowerCase())){ seen.add(g.en.toLowerCase()); out.push(g); } }
  return out.slice(0,6);
}

    RATE_LIMIT:'Gemini đang giới hạn lượt sử dụng. Hãy thử lại sau.',

    PARSE:'Gemini không trả về kết quả hợp lệ. Hãy thử lại.',
  })[code] || 'Không thể đánh giá lúc này. Hãy thử lại sau.';
}

// tô đậm những từ đã thay đổi so với câu gốc
function highlightDiff(orig, corrected){
  const oWords = (orig||'').trim().split(/\s+/);
  const cWords = (corrected||'').trim().split(/\s+/);
  const oSet = new Set(oWords.map(w=>w.toLowerCase().replace(/[^a-z0-9']/g,'')));
  return cWords.map(w=>{
    const clean=w.toLowerCase().replace(/[^a-z0-9']/g,'');
    return oSet.has(clean)? escapeHtml(w) : `<span class="hl-change">${escapeHtml(w)}</span>`;
  }).join(' ');
}

/* Bộ chấm CỤC BỘ (Phase 2 — chưa AI). Trả về JSON cùng format Phase 3 sẽ dùng,
   để khi cắm Gemini vào không phải sửa UI. */
function gradeLocally(sentence, vocab, ex){
  ex = ex || getExercises(vocab)[0] || {targetPhrase:vocab.word};
  const raw = sentence.trim();
  const s = raw.toLowerCase();
  const target = ex.targetPhrase.toLowerCase();
  const words = s.split(/\s+/).filter(Boolean);

  // target dùng chưa? (khớp mềm: bỏ dấu câu, cho phép biến thể "-" / khoảng trắng)
  const norm = x => x.replace(/[^a-z\s]/g,'').replace(/\s+/g,' ').trim();
  const targetUsed = norm(s).includes(norm(target)) ||
    norm(target).split(' ').every(t=>norm(s).split(' ').includes(t));

  const fixes = [];        // { bad, good }
  const feedback = [];     // string[] tiếng Việt

  // Heuristic lỗi phổ biến người Việt (chỉ gợi ý, không phải chấm tuyệt đối)
  if(words.length && !/[.!?]$/.test(raw)) feedback.push('Câu nên kết thúc bằng dấu chấm.');
  if(/\bi\b/.test(s) && !/\bI\b/.test(raw)) { fixes.push({bad:'i', good:'I', reason:'Đại từ "I" luôn viết hoa dù ở giữa câu.'}); }
  // "I am + V-nguyên thể" (lỗi hay gặp)
  const amVerb = s.match(/\bi am (\w+)\b/);
  if(amVerb && !/ing$|tired|happy|ready|sure|able|responsible|interested/.test(amVerb[1])){
    feedback.push('Cẩn thận "I am + động từ": thường dùng "I " + động từ (vd: "I help"), hoặc "I am " + V-ing.');
  }
  // lặp từ liền nhau
  for(let i=1;i<words.length;i++){ if(words[i]===words[i-1] && words[i].length>2){ fixes.push({bad:words[i]+' '+words[i], good:words[i], reason:'Bị lặp từ liền nhau.'}); break; } }

  // Điểm từng tiêu chí (ước lượng cục bộ)
  const lenOk = words.length>=4 && words.length<=40;
  let vocabularyScore = targetUsed?100:25;
  let grammarScore = Math.max(40, 100 - fixes.length*18 - (lenOk?0:15));
  let meaningScore = targetUsed? (lenOk?85:70) : 45;
  let naturalnessScore = Math.max(45, grammarScore - 8 + (lenOk?5:0));
  let score = Math.round(vocabularyScore*.3 + grammarScore*.3 + meaningScore*.25 + naturalnessScore*.15);
  // Thiếu cụm mục tiêu là lỗi nặng nhất trong app này → trần điểm 55
  if(!targetUsed) score = Math.min(score, 55);
  const isAcceptable = targetUsed && score>=70;

  if(!targetUsed) feedback.unshift(`Bạn chưa dùng cụm mục tiêu "${ex.targetPhrase}". Hãy đưa nó vào câu.`);
  if(targetUsed && !feedback.length) feedback.push('Câu ổn! Bạn đã dùng đúng cụm mục tiêu.');

  return {
    score, meaningScore, grammarScore, vocabularyScore, naturalnessScore,
    targetWordUsed: targetUsed, isAcceptable,
    originalSentence: raw,
    correctedSentence: raw,
    fixes,
    feedback,
    explanationVi: targetUsed
      ? 'Đây là chấm cơ bản bằng máy. Bật AI trong Cài đặt để có phân tích ngữ pháp, chữa câu chi tiết và câu mẫu tốt nhất.'
      : 'Câu chưa đạt vì thiếu cụm mục tiêu. Hãy viết lại và chèn cụm đó vào.',
    bestVersion: '',          // chỉ AI mới đề xuất câu mẫu
    moreNaturalVersion: '',
    _local: true,
  };
}
async function evaluateAnswer(){
  const v=state.practiceVocab; const sent=(state.practiceInput||'').trim();
  if(!sent){ toast('Hãy nhập câu trước đã'); return; }
  // Không có key → chấm máy luôn (UI đã báo trước cần bật AI)
  if(!hasKey()){ const r=gradeLocally(sent,v); finishEvaluation(v,r); return; }
  if(!isOnline()){ state.practiceError='OFFLINE'; state.tab='result'; render(); document.getElementById('main').scrollTop=0; return; }
  // Có key + online → gọi AI, có loading
  state.practiceLoading=true; state.practiceError=null; render();
  try{
    const r = await evaluateWithGemini(sent, v);
    state.practiceLoading=false;
    finishEvaluation(v, r);
  }catch(e){
    // KHÔNG âm thầm chấm máy: hiện rõ lý do + để nút "Chấm bằng máy"
    state.practiceLoading=false;
    state.practiceError=e.message||'UNKNOWN';
    state.tab='result'; render(); document.getElementById('main').scrollTop=0;
  }
}
function finishEvaluation(v, r){
  state.practiceResult=r; state.practiceError=null;
  recordPractice(v.id, r.score, r.isAcceptable);
  state.tab='result'; render(); document.getElementById('main').scrollTop=0;
}

function nextInterval(box){ return [1,2,4,7,14][Math.min(box,4)]; } // ngày
function dueList(){
  const t=todayStr();
  return allVocab().filter(v=>{ const nd=DATA.reviewQueue[v.id]; return nd && nd<=t; });
}
const dueCount = () => dueList().length;
function last7Days(){
  const out=[]; const names=['CN','T2','T3','T4','T5','T6','T7'];
  const perDay = {};
  Object.values(DATA.learned).forEach(x=>{ const d=new Date(x.ts).toISOString().slice(0,10); perDay[d]=(perDay[d]||0)+1; });
  for(let i=6;i>=0;i--){ const dt=new Date(Date.now()-i*864e5); const key=dt.toISOString().slice(0,10);
    out.push({ label:names[dt.getDay()], count:perDay[key]||0 }); }
  return out;
}

/* =================================================================
   ACTIONS / ROUTER
================================================================= */
const VIEWS = { home:viewHome, learn:viewLearn, topic:viewTopic, flash:viewFlash, review:viewReview, progress:viewProgress, practice:viewPractice, result:viewResult };
const HIDE_FAB = new Set(['flash','practice','result']);
function render(){
  document.getElementById('main').innerHTML = `<div class="fade">${VIEWS[state.tab]()}</div>`;
  document.getElementById('nav').innerHTML = navHTML();
  const fab=document.getElementById('fab');
  fab.style.display = HIDE_FAB.has(state.tab)? 'none':'block';
  if(HIDE_FAB.has(state.tab)) fab.classList.remove('open');
  applyTheme();
  const si=document.getElementById('searchInput'); if(si){ si.focus(); si.setSelectionRange(si.value.length,si.value.length); }
}
function go(tab){ state.tab=tab; state.search=''; closeFab(); render(); document.getElementById('main').scrollTop=0; }
function openTopic(id){ state.topic=id; state.tab='topic'; closeFab(); render(); document.getElementById('main').scrollTop=0; }
function openTopicAt(topicId,vocabId){ startDeck(topicId,vocabId); }
function onSearch(v){ state.search=v; render(); }

function startDeck(topicId, startId){
  let list=allVocab().filter(v=>v.topic===topicId);
  state.deck=list; state.deckIdx = startId? Math.max(0,list.findIndex(v=>v.id===startId)) : 0;
  state.flip=false; state.tab='flash'; render(); document.getElementById('main').scrollTop=0;
}
function startReview(){
  const due=dueList();
  const deck = due.length? due : allVocab().filter(v=>DATA.learned[v.id]).slice(0,10);
  if(!deck.length){ toast('Chưa có từ nào để ôn — học từ mới trước nhé!'); go('learn'); return; }
  state.deck=deck; state.deckIdx=0; state.flip=false; state.tab='flash'; closeFab(); render();
}
function exitDeck(){ state.tab = state.topic? 'topic':'learn'; render(); }

/* Practice actions */
function startPractice(){
  const v=pickPracticeVocab();
  if(!v){ toast('Học vài từ trước để luyện nhé!'); go('learn'); return; }
  state.practiceVocab=v; state.practiceInput=''; state.practiceResult=null;
  closeFab(); state.tab='practice'; render(); document.getElementById('main').scrollTop=0;
}
function startPracticeStruggle(){
  const list=struggleList();
  state.practiceVocab = list.length? list[0].v : pickPracticeVocab();
  state.practiceInput=''; state.practiceResult=null;
  state.tab='practice'; render(); document.getElementById('main').scrollTop=0;
}
function nextPractice(){
  state.practiceVocab=pickPracticeVocab(); state.practiceInput=''; state.practiceResult=null;
  state.tab='practice'; render(); document.getElementById('main').scrollTop=0;
}
function retryPractice(){ state.practiceResult=null; state.practiceError=null; state.tab='practice'; render(); }
function gradeNowLocal(){
  const v=state.practiceVocab, sent=(state.practiceInput||'').trim();
  if(!sent){ retryPractice(); return; }
  state.practiceError=null;
  const r=gradeLocally(sent,v); finishEvaluation(v,r);
}
function retryAIEval(){ state.practiceError=null; state.tab='practice'; render(); setTimeout(()=>evaluateAnswer(),50); }
function exitPractice(){ state.practiceResult=null; go('review'); }
function flip(){ state.flip=!state.flip; state.fxTab=0; render(); }
function rate(known){
  const v=state.deck[state.deckIdx]; if(!v) return;
  markLearned(v.id);
  const box = known? (DATA.learned[v.id].box) : 0;
  DATA.reviewQueue[v.id] = new Date(Date.now()+nextInterval(box)*864e5).toISOString().slice(0,10);
  save();
  state.flip=false; state.fxTab=0;
  if(state.deckIdx < state.deck.length-1){ state.deckIdx++; } else { state.deckIdx=state.deck.length; }
  render();
}

/* ---- Luyện câu inline trong flashcard ---- */
function fxOnInput(vid, idx, val){ fxSet(vid, idx, {input:val}); } // không render để không mất focus
function fxTabTo(i){ state.fxTab=i; render(); scrollToPractice(); }
function scrollToPractice(){ setTimeout(()=>{ const el=document.querySelector('.practice-inline'); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); },60); }
async function fxEvaluate(vid, idx){
  const v=findVocab(vid); const ex=getExercises(v)[idx];
  const sent=(fxGet(vid,idx).input||'').trim();
  if(!sent){ toast('Hãy nhập câu trước đã'); return; }
  // Không có key hoặc offline → chấm máy luôn (đã có banner báo trước ở UI)
  if(!hasKey()){ const r=gradeLocally(sent,v,ex); fxFinish(vid,idx,v,r); return; }
  if(!isOnline()){ fxSet(vid,idx,{error:'OFFLINE'}); render(); scrollToPractice(); return; }
  fxSet(vid,idx,{loading:true,error:null}); render(); scrollToPractice();
  try{
    const r=await evaluateWithGemini(sent,v,ex);
    fxSet(vid,idx,{loading:false}); fxFinish(vid,idx,v,r);
  }catch(e){
    // KHÔNG âm thầm chấm máy: hiện rõ lý do lỗi + để nút "Chấm bằng máy"
    fxSet(vid,idx,{loading:false, error:e.message||'UNKNOWN'});
    render(); scrollToPractice();
  }
}
function fxGradeLocalNow(vid, idx){
  const v=findVocab(vid); const ex=getExercises(v)[idx];
  const sent=(fxGet(vid,idx).input||'').trim(); if(!sent) return;
  const r=gradeLocally(sent,v,ex); fxSet(vid,idx,{error:null}); fxFinish(vid,idx,v,r);
}
function fxFinish(vid, idx, v, r){
  fxSet(vid,idx,{result:r,error:null});
  recordPractice(v.id, r.score, r.isAcceptable);
  render(); scrollToPractice();
}

/* ---- Gợi ý từ ---- */
async function fxToggleHints(vid, idx){
  const st=fxGet(vid,idx);
  if(st.hints || st.hintsLoading){ fxSet(vid,idx,{hints:null,hintsLoading:false}); render(); scrollToPractice(); return; }
  const v=findVocab(vid); const ex=getExercises(v)[idx];
  fxSet(vid,idx,{hintsLoading:true}); render(); scrollToPractice();
  let words;
  try{ words=await suggestWordsAI(v,ex); }
  catch(e){ words=suggestWordsLocal(v,ex); if(e.message==='BAD_KEY') toast('Key AI lỗi — gợi ý cơ bản'); }
  if(!words || !words.length) words=suggestWordsLocal(v,ex);
  fxSet(vid,idx,{hints:words,hintsLoading:false}); render(); scrollToPractice();
}
function fxInsertWord(vid, idx, word){
  const st=fxGet(vid,idx);
  const cur=(st.input||'').trim();
  const next=(cur? cur+' ' : '')+word;
  fxSet(vid,idx,{input:next});
  const ta=document.getElementById('fxInput'); if(ta){ ta.value=next; ta.focus(); }
  toast('Đã chèn "'+word+'"');
}
const savedKey = en => 'my-'+en.toLowerCase().replace(/[^a-z0-9]+/g,'-');
function isSaved(en){ return (DATA.myWords||[]).some(w=>w.id===savedKey(en)); }
function fxCopyBest(sentence){
  // đưa câu mẫu vào ô nhập của đề đang mở để học viên chép/sửa lại
  const v = state.deck[state.deckIdx]; if(!v) return;
  const idx = state.fxTab||0;
  fxSet(v.id, idx, {input:sentence});
  const ta=document.getElementById('fxInput'); if(ta){ ta.value=sentence; ta.focus(); }
  toast('Đã đưa câu mẫu vào ô nhập');
}
function fxSaveWord(en, vi){
  if(!DATA.myWords) DATA.myWords=[];
  const id=savedKey(en);
  const exist=DATA.myWords.findIndex(w=>w.id===id);
  if(exist>=0){ DATA.myWords.splice(exist,1); save(); toast('Đã bỏ khỏi Từ của tôi'); }
  else { DATA.myWords.push({id, word:en, meaningVi:vi, ts:Date.now()}); save(); toast('⭐ Đã lưu vào Từ của tôi'); }
  render(); scrollToPractice();
}

/* Theme */
function applyTheme(){
  const light = DATA.theme==='light';
  document.documentElement.classList.toggle('light', light);
  document.querySelector('meta[name=theme-color]').setAttribute('content', light?'#f4f5f7':'#0e0e10');
}
function toggleTheme(){ DATA.theme = DATA.theme==='light'?'dark':'light'; save(); render(); }

/* FAB */
function toggleFab(){ document.getElementById('fab').classList.toggle('open'); }
function closeFab(){ document.getElementById('fab').classList.remove('open'); }

/* Sheet: Settings + Export/Import (đưa lên sớm vì dữ liệu ở local) */
function openSettings(){
  const keySet = hasKey();
  const body=`<h2>⚙️ Cài đặt</h2><p class="sub">Ứng dụng cá nhân — dữ liệu lưu trên máy bạn.</p>

    <div class="card" style="margin:0 0 12px;border-color:${keySet?'var(--success)':'var(--border)'}">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
        <span class="card-title">✨ AI chấm câu (Gemini)</span>
        <span style="flex:1"></span>
        <span class="chip ${keySet?'':'chip-muted'}" style="${keySet?'background:var(--success-bg);color:var(--success)':''}">${keySet?'Đang bật':'Chưa bật'}</span>
      </div>
      <div class="card-sub" style="margin-bottom:12px">Miễn phí với Gemini free tier. Lấy key tại
        <a class="link" href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener">Google AI Studio</a>,
        dán vào đây. Key chỉ lưu trên máy bạn.</div>
      <input class="key-input" id="geminiKeyInput" type="password" placeholder="Dán Gemini API key (AIza...)"
        value="${escapeHtml(DATA.geminiKey||'')}" />
      <div style="display:flex;gap:8px">
        <button class="btn btn-brand btn-sm" onclick="saveGeminiKey()">Lưu key</button>
        ${keySet?`<button class="btn btn-outline btn-sm" onclick="clearGeminiKey()">Xoá</button>`:''}
      </div>
    </div>

    <div class="card" style="margin:0 0 12px">
      <div class="card-title" style="margin-bottom:10px">Mục tiêu mỗi ngày</div>
      <div style="display:flex;gap:8px">
        ${[5,10,15].map(n=>`<button class="btn ${DATA.dailyGoal===n?'btn-brand':'btn-ghost'} btn-sm" onclick="setGoal(${n})">${n} từ</button>`).join('')}
      </div>
    </div>

    <div class="card" style="margin:0 0 12px">
      <div class="card-title" style="margin-bottom:6px">Giao diện</div>
      <div style="display:flex;gap:8px">
        <button class="btn ${DATA.theme==='dark'?'btn-brand':'btn-ghost'} btn-sm" onclick="setTheme('dark')">🌙 Tối</button>
        <button class="btn ${DATA.theme==='light'?'btn-brand':'btn-ghost'} btn-sm" onclick="setTheme('light')">☀️ Sáng</button>
      </div>
    </div>

    <div class="card" style="margin:0 0 12px">
      <div class="card-title" style="margin-bottom:4px">Sao lưu & khôi phục</div>
      <div class="card-sub" style="margin-bottom:12px">Xuất file .json để giữ dữ liệu khi đổi máy / xóa trình duyệt.</div>
      <button class="btn btn-outline btn-sm" style="margin-bottom:8px" onclick="exportData()">⬇️ Xuất dữ liệu (backup)</button>
      <button class="btn btn-outline btn-sm" onclick="document.getElementById('importFile').click()">⬆️ Nhập dữ liệu</button>
      <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importData(event)" />
    </div>

    ${!isStandalone()?`<div class="card" style="margin:0 0 12px">
      <div class="card-title" style="margin-bottom:4px">📲 Cài như ứng dụng</div>
      <div class="card-sub" style="margin-bottom:12px">Thêm vào màn hình chính để mở nhanh như app thật, chạy được cả khi offline.</div>
      <button class="btn btn-brand btn-sm" onclick="promptInstall()">Thêm vào màn hình chính</button>
      <div class="card-sub" style="margin-top:8px">iPhone: bấm nút Chia sẻ ⬆️ trong Safari → "Thêm vào MH chính".</div>
    </div>`:''}

    <div class="card" style="margin:0 0 12px">
      <div class="card-title" style="margin-bottom:8px">Về ứng dụng</div>
      <div class="card-sub" style="line-height:1.6">English Coach · phiên bản MVP (1.0)<br>
        Triết lý: <b style="color:var(--ink)">Biết từ chưa đủ — phải dùng được từ.</b><br>
        Ứng dụng cá nhân, dữ liệu ở máy bạn, không tài khoản, không quảng cáo.</div>
    </div>

    <button class="btn btn-outline btn-sm" style="color:var(--danger)" onclick="resetAll()">🗑️ Xóa toàn bộ tiến độ</button>`;
  showSheet(body);
}
function setGoal(n){ DATA.dailyGoal=n; save(); openSettings(); render(); }
function setTheme(t){ DATA.theme=t; save(); openSettings(); render(); }
function saveGeminiKey(){
  const el=document.getElementById('geminiKeyInput'); const k=(el?.value||'').trim();
  DATA.geminiKey=k; save(); openSettings(); render();
  toast(k? 'Đã lưu key ✓ AI đã bật':'Đã xoá key');
}
function clearGeminiKey(){ DATA.geminiKey=''; save(); openSettings(); render(); toast('Đã xoá key'); }
function exportData(){
  const blob=new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='english-coach-backup.json'; a.click(); URL.revokeObjectURL(a.href);
  toast('Đã xuất backup ✓');
}
function importData(e){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ DATA={...defaultData(),...JSON.parse(r.result)}; save(); closeSheet(); render(); toast('Đã khôi phục dữ liệu ✓'); }
    catch(err){ toast('File không hợp lệ'); } };
  r.readAsText(f);
}
function resetAll(){
  if(confirm('Xóa toàn bộ tiến độ học? Không thể hoàn tác.')){ DATA=defaultData(); save(); closeSheet(); render(); toast('Đã reset'); }
}

function showSheet(html){ document.getElementById('sheetBody').innerHTML=html;
  document.getElementById('overlay').classList.add('show'); document.getElementById('sheet').classList.add('show'); }
function closeSheet(){ document.getElementById('overlay').classList.remove('show'); document.getElementById('sheet').classList.remove('show'); }

/* Toast */
let toastT;
function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),1900); }

/* utils */
function escq(s){ return String(s).replace(/'/g,"\\'").replace(/"/g,'&quot;'); }
function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* =================================================================
   PWA — single-file build.
   Manifest + apple meta + Add to Home Screen đủ để cài như app.
   (Service worker cần file .js riêng cùng origin nên bỏ ở bản 1-file;
   app vẫn chạy offline vì toàn bộ nằm trong 1 file đã tải, dữ liệu ở
   localStorage. Chỉ AI cần Internet.)
================================================================= */
// Add to Home Screen (Android/Chrome)
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); deferredPrompt=e; });
async function promptInstall(){
  if(!deferredPrompt){ toast('iPhone: bấm Chia sẻ ⬆️ → "Thêm vào MH chính"'); return; }
  deferredPrompt.prompt();
  try{ await deferredPrompt.userChoice; }catch(e){}
  deferredPrompt=null; openSettings();
}
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true;

/* boot */
window.addEventListener('online',()=>{ if(state.tab==='practice') render(); });
window.addEventListener('offline',()=>{ if(state.tab==='practice') render(); });
render();
</script>
