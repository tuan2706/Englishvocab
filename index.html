<style>
/* =================================================================
   TOKENS — Design DNA (dark premium, 1 brand color)
================================================================= */
:root{
  /* Premium "Night Indigo" — tinh chỉnh theo phong cách iOS dark: nền dịu, phân cấp surface rõ, viền & bóng nhẹ */
  --bg:#0b1020;--surface:#161d2e;--surface-2:#1f2739;
  --border:rgba(255,255,255,.08);--border-strong:rgba(255,255,255,.15);
  --ink:#f5f7fa;--muted:#8b93a7;
  --brand:#6366f1;--brand-2:#7c3aed;--brand-light:rgba(99,102,241,.15);--brand-glow:rgba(99,102,241,.28);
  --brand-grad:linear-gradient(135deg,#6366f1 0%,#7c3aed 100%);
  --success:#32d583;--success-bg:rgba(50,213,131,.13);
  --danger:#f97066;--danger-bg:rgba(249,112,102,.13);
  --warn:#fdb022;--warn-bg:rgba(253,176,34,.13);
  --glass-bg:rgba(18,24,38,.72);--glass-border:rgba(255,255,255,.09);
  /* Radius kiểu iOS: card mềm nhưng không quá tròn, control vừa phải */
  --r-card:20px;--r-btn:14px;
  /* thang khoảng cách 4/8px */
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-6:24px;--sp-8:32px;
  /* Bóng rất nhẹ kiểu iOS */
  --sh-card:0 1px 2px rgba(0,0,0,.18),0 6px 20px -12px rgba(0,0,0,.45);
  --sh-float:0 8px 30px -10px rgba(0,0,0,.5);
  --sh-glow:0 6px 20px -8px var(--brand-glow);
  color-scheme:dark;
}
html.light{
  --bg:#f2f4f9;--surface:#ffffff;--surface-2:#f5f6fb;
  --border:rgba(60,60,67,.1);--border-strong:rgba(60,60,67,.2);
  --ink:#1c1c28;--muted:#6b7280;
  --brand:#4f46e5;--brand-2:#7c3aed;--brand-light:rgba(79,70,229,.09);--brand-glow:rgba(79,70,229,.18);
  --brand-grad:linear-gradient(135deg,#4f46e5 0%,#7c3aed 100%);
  --success:#059669;--success-bg:rgba(5,150,105,.1);
  --danger:#dc2626;--danger-bg:rgba(220,38,38,.09);
  --warn:#d97706;--warn-bg:rgba(217,119,6,.1);
  --glass-bg:rgba(255,255,255,.8);--glass-border:rgba(60,60,67,.08);
  --sh-card:0 1px 2px rgba(60,60,67,.08),0 6px 18px -12px rgba(60,60,67,.25);
  --sh-float:0 8px 30px -10px rgba(60,60,67,.22);
  color-scheme:light;
}
*{box-sizing:border-box;border-color:var(--border);-webkit-tap-highlight-color:transparent}
html,body{width:100%;min-height:100%;margin:0;overscroll-behavior-y:none}
body{
  background:#0b1020;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","Open Sans",Inter,system-ui,"Segoe UI",Roboto,sans-serif;
  letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;
  display:flex;justify-content:center;align-items:flex-start;
  /* Chiều cao giao hoàn toàn cho CSS xử lý — trình duyệt tự điều chỉnh khi thanh địa chỉ ẩn/hiện,
     không còn JS resize liên tục (đúng khuyến nghị: để browser lo phần viewport). */
  height:100vh;height:100svh;height:100dvh;overflow:hidden;
}
html.light body{background:#f2f4f9}
h1,h2,h3{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue","Poppins",Inter,system-ui,sans-serif;letter-spacing:-.022em;margin:0;font-weight:700}
.tabular{font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* App shell */
.app{position:relative;width:100%;background:var(--bg);overflow:hidden;
  height:100vh;height:100svh;height:100dvh;display:flex;flex-direction:column}
.app::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(60% 40% at 15% 0%,rgba(99,102,241,.18),transparent 60%),
    radial-gradient(55% 35% at 100% 8%,rgba(124,58,237,.16),transparent 55%);}
html.light .app::before{background:
  radial-gradient(60% 40% at 15% 0%,rgba(99,102,241,.12),transparent 60%),
  radial-gradient(55% 35% at 100% 8%,rgba(124,58,237,.1),transparent 55%);}
@media(min-width:470px){
  .app{max-width:430px;height:calc(100dvh - 48px);margin:24px 0;border-radius:28px;
    border:1px solid var(--glass-border);
    box-shadow:0 0 0 10px rgba(124,58,237,.04),0 40px 90px -20px rgba(2,6,23,.8)}
}
/* Vùng cuộn DUY NHẤT — cố định trong khung, không kéo theo cả trang */
.main{position:relative;z-index:1;flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;padding:calc(20px + env(safe-area-inset-top)) 16px calc(var(--tabbar-height) + env(safe-area-inset-bottom) + 16px)}

/* Header */
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:20px}
.phead .desc{font-size:13px;color:var(--muted);margin:0 0 3px}
.phead h1{font-size:27px;font-weight:700}
.icon-btn-wrap{}
.icon-btn{width:44px;height:44px;border-radius:999px;display:flex;align-items:center;justify-content:center;
  background:var(--surface);border:1px solid var(--border);color:var(--ink);flex:none;
  transition:transform .18s cubic-bezier(.34,1.56,.64,1),background .18s,border-color .18s}
.icon-btn:hover{border-color:var(--brand);color:var(--brand)}
.icon-btn:active{transform:scale(.9)}
.icon-btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* Card */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);
  box-shadow:var(--sh-card);padding:18px;margin-bottom:14px}
.card-title{font-size:15px;font-weight:600;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Poppins",sans-serif}
.card-sub{font-size:13px;color:var(--muted);margin-top:2px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;
  border-radius:var(--r-btn);font-size:15px;font-weight:600;width:100%;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Poppins",sans-serif;letter-spacing:-.01em;
  transition:transform .2s ease-out,filter .2s ease-out,box-shadow .2s ease-out}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.btn-brand{background:var(--brand);color:#fff;box-shadow:0 2px 10px -4px var(--brand-glow)}
.btn-brand:hover{filter:brightness(1.06);box-shadow:0 4px 16px -6px var(--brand-glow)}
.btn-outline{border:1px solid var(--border-strong);background:transparent;color:var(--ink)}
.btn-outline:hover{border-color:var(--brand);color:var(--brand)}
.btn-ghost{background:var(--surface-2);color:var(--ink)}
.btn-ghost:hover{filter:brightness(1.06)}
.btn-sm{min-height:44px;font-size:14px;padding:0 16px;border-radius:12px}

/* Chips / badges */
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:999px;font-size:12px;
  font-weight:600;background:var(--brand-light);color:var(--brand);white-space:nowrap}
.chip-muted{background:var(--surface-2);color:var(--muted)}
.chip-lvl{background:var(--warn-bg);color:var(--warn)}

/* Stats */
.stat-row{display:flex;gap:10px;margin-bottom:14px}
.stat{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 12px;box-shadow:var(--sh-card)}
.stat .n{font-size:23px;font-weight:700;line-height:1;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Poppins",sans-serif}
.stat .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:6px}

/* Progress */
.progress{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--brand-grad);border-radius:999px;transition:width .6s cubic-bezier(.16,1,.3,1)}

/* Search */
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-btn);padding:0 14px;height:46px;margin-bottom:16px}
.search input{flex:1;background:none;border:none;outline:none;color:var(--ink);font-size:16px}
.search input::placeholder{color:var(--muted)}

/* Topic row */
.topic{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);
  border-radius:16px;box-shadow:var(--sh-card);padding:14px 16px;margin-bottom:10px;width:100%;text-align:left;
  transition:transform .2s ease-out,border-color .2s ease-out}
.topic:hover{border-color:var(--brand-light)}
.topic:active{transform:scale(.98)}
.topic .emo{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:22px;background:var(--brand-light);flex:none}
.topic .body{flex:1;min-width:0}
.topic .t{font-size:15px;font-weight:600;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Poppins",sans-serif}
.topic .meta{font-size:12px;color:var(--muted);margin:3px 0 8px}
.topic .arrow{color:var(--muted);font-size:18px;flex:none}

/* Vocab list item */
.vitem{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--border);width:100%;text-align:left}
.vitem:last-child{border-bottom:none}
.vitem .w{font-size:15px;font-weight:600}
.vitem .m{font-size:13px;color:var(--muted);margin-top:2px}
.vitem .dot{width:9px;height:9px;border-radius:999px;flex:none;background:var(--surface-2)}
.vitem .dot.learned{background:var(--success)}

/* Flashcard */
.flash{perspective:1400px;height:340px;margin-bottom:18px}
.flash-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.16,1,.3,1);
  transform-style:preserve-3d;cursor:pointer}
.flash.flipped .flash-inner{transform:rotateY(180deg)}
.flash-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:var(--r-card);border:1px solid var(--border);background:var(--surface);box-shadow:var(--sh-card);
  display:flex;flex-direction:column;padding:22px;overflow:hidden}
.flash-front{align-items:center;justify-content:center;text-align:center;gap:6px}
.flash-front .word{font-size:32px;font-weight:700;line-height:1.15;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Poppins",sans-serif}
.flash-front .ipa{font-size:15px;color:var(--muted);margin-top:4px}
.flash-front .tap{position:absolute;bottom:18px;font-size:12px;color:var(--muted);letter-spacing:.03em}
.flash-back{transform:rotateY(180deg);gap:14px;overflow-y:auto}
.flash-back .sec .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;margin-bottom:4px}
.flash-back .sec .en{font-size:15px;line-height:1.5}
.flash-back .sec .vi{font-size:16px;font-weight:600;color:var(--brand)}
.flash-back .sec .ex{font-size:14px;line-height:1.5;font-style:italic}
.coll{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}

.deck-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.deck-count{font-size:13px;color:var(--muted);font-weight:600}

/* Continue card special */
.cont{background:var(--brand-grad);
  border:none;color:#fff;border-radius:var(--r-card);padding:22px;box-shadow:var(--sh-glow);margin-bottom:16px;
  width:100%;text-align:left;transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
.cont:active{transform:scale(.97)}
.cont .k{font-size:12px;opacity:.9;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.cont .v{font-size:21px;font-weight:700;margin:6px 0 4px;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Poppins",sans-serif}
.cont .p{font-size:12.5px;opacity:.9;margin-bottom:12px}
.cont .bar{height:7px;background:rgba(255,255,255,.25);border-radius:999px;overflow:hidden}
.cont .bar>i{display:block;height:100%;background:#fff;border-radius:999px}

/* Quick actions */
.qa{display:flex;gap:10px}
.qa button{flex:1;display:flex;align-items:center;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--border);
  border-radius:16px;padding:16px 8px;font-size:12px;font-weight:600;box-shadow:var(--sh-card);min-height:80px;justify-content:center;
  transition:transform .18s cubic-bezier(.34,1.56,.64,1),border-color .2s}
.qa button:hover{border-color:var(--brand-light)}
.qa button:active{transform:scale(.94)}
.qa button .e{display:flex;align-items:center;justify-content:center;color:var(--brand)}

/* Section label */
.slabel{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;
  margin:22px 4px 12px}

/* ===== Bottom tab bar — VIEWPORT-LEVEL, ngoài .app hoàn toàn (xem DOM: <nav> là sibling của .app
   trong <body>, không phải con của .app/.main). Đây là điều kiện tiên quyết để position:fixed
   neo đúng viewport tuyệt đối trên MỌI trình duyệt/webview, không phụ thuộc bất kỳ thuộc tính nào
   của .app (loại trừ hoàn toàn khả năng ancestor tạo containing block hoặc bounce kéo theo). ===== */
:root{ --tabbar-height:58px; } /* chiều cao PHẦN NỘI DUNG tab bar (chưa gồm safe-area) — đã đo thực tế, xem mục .main bên dưới */

.nav{position:fixed;left:0;right:0;bottom:0;width:100%;z-index:30;
  background:var(--glass-bg);border-top:1px solid var(--glass-border);
  backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
  /* Nền kéo dài LIỀN MẠCH xuống hết safe-area (Home Indicator) — không để lộ khoảng trống phía dưới */
  padding-bottom:env(safe-area-inset-bottom);
}
@media(min-width:470px){
  /* Desktop: .app là khung điện thoại thu nhỏ có margin:24px riêng — nav căn giữa & khớp bề rộng
     khung đó để trông liền một khối, KHÔNG còn chạy hết chiều ngang trình duyệt như trên mobile. */
  .nav{left:50%;right:auto;transform:translateX(-50%);width:100%;max-width:430px;
    bottom:24px;border-radius:0 0 28px 28px;border:1px solid var(--glass-border);
    box-shadow:0 24px 60px -20px rgba(2,6,23,.5);padding-bottom:0}
}
.nav-inner{display:flex;justify-content:space-around;align-items:center;height:var(--tabbar-height);padding:0 8px}
.nav a{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0;min-height:44px;justify-content:center;
  font-size:10px;font-weight:500;color:var(--muted);border-radius:14px;transition:color .2s}
.nav a.active{color:var(--brand)}
.nav a .ico{width:22px;height:22px}
.nav a .hl{position:absolute;inset:2px 10px;border-radius:14px;background:var(--brand-light);z-index:-1;opacity:0;transition:opacity .25s}
.nav a.active .hl{opacity:1}
/* Khi bàn phím mở: ẩn thanh điều hướng + FAB — CSS thuần theo trạng thái class, KHÔNG có JS nào
   tính toán top/transform/translateY theo scroll hay theo chiều cao bàn phím (đúng yêu cầu mục 12/14):
   tab bar chỉ ẩn/hiện, không di chuyển, không "chạy theo" visual viewport. */
body.kb-open .nav{display:none}
body.kb-open .fab{display:none!important}
body.kb-open .main{padding-bottom:16px}

/* FAB — SIBLING trực tiếp của .app trong <body> (giống nav) — viewport-level, tránh mọi rủi ro
   containing-block/bounce nếu còn lồng trong .app. Neo phía TRÊN tab bar bằng --tabbar-height. */
.fab{position:fixed;left:0;right:0;bottom:calc(var(--tabbar-height) + env(safe-area-inset-bottom) + 16px);
  z-index:40;pointer-events:none}
@media(min-width:470px){
  /* Khớp vị trí với nav trên desktop (nav bottom:24px, cao --tabbar-height) — căn giữa theo khung .app */
  .fab{left:50%;right:auto;transform:translateX(-50%);width:100%;max-width:430px;
    bottom:calc(24px + var(--tabbar-height) + 16px)}
}
.fab-btn{position:absolute;right:16px;bottom:0;width:56px;height:56px;border-radius:999px;background:var(--brand);
  color:#fff;box-shadow:var(--sh-glow);display:flex;align-items:center;justify-content:center;font-size:26px;
  pointer-events:auto;transition:transform .3s cubic-bezier(.16,1,.3,1)}
.fab-btn:active{transform:scale(.92)}
.fab.open .fab-btn{transform:rotate(45deg)}
.fab-menu{position:absolute;right:16px;bottom:70px;display:flex;flex-direction:column;align-items:flex-end;gap:12px;pointer-events:none}
.fab.open .fab-menu{pointer-events:auto}
.fab-item{display:flex;align-items:center;gap:12px;opacity:0;transform:translateY(12px) scale(.9);
  transition:all .25s cubic-bezier(.16,1,.3,1)}
.fab.open .fab-item{opacity:1;transform:none}
.fab.open .fab-item:nth-child(1){transition-delay:.02s}
.fab.open .fab-item:nth-child(2){transition-delay:.05s}
.fab.open .fab-item:nth-child(3){transition-delay:.08s}
.fab-item .lbl{background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:7px 13px;
  font-size:13px;font-weight:600;box-shadow:var(--sh-float)}
.fab-item .dot{width:44px;height:44px;border-radius:999px;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:18px;box-shadow:var(--sh-float)}

/* Bottom sheet */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(2px);z-index:50;opacity:0;
  pointer-events:none;transition:opacity .25s}
.overlay.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%) translateY(100%);width:100%;max-width:430px;
  max-height:88vh;overflow-y:auto;background:var(--surface);border-radius:20px 2rem 0 0;border-top:1px solid var(--border);
  box-shadow:var(--sh-float);z-index:51;padding:12px 20px calc(24px + env(safe-area-inset-bottom));
  transition:transform .32s cubic-bezier(.16,1,.3,1)}
.sheet.show{transform:translateX(-50%) translateY(0)}
.sheet .handle{width:40px;height:5px;border-radius:999px;background:var(--border-strong);margin:0 auto 14px}
.sheet h2{font-size:19px;font-weight:700;margin-bottom:4px}
.sheet .sub{font-size:14px;color:var(--muted);margin-bottom:18px}

/* Empty state */
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
/* Lịch từ đã học */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin:8px 0 14px}
.cal-title{font-size:17px;font-weight:700;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Poppins",sans-serif}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;background:var(--surface);border:1px solid var(--border);
  border-radius:18px;box-shadow:var(--sh-card);padding:12px 8px 16px}
.cal-dow{text-align:center;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0 10px;min-width:0}
.cal-cell{position:relative;min-width:0;aspect-ratio:1/1.2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  border-radius:12px;background:none;border:none;transition:transform .15s,background .15s}
.cal-cell.empty{visibility:hidden}
.cal-cell:active{transform:scale(.9)}
.cal-cell .cal-num{font-size:15px;font-weight:600;color:var(--ink)}
.cal-cell.has:hover{background:var(--surface-2)}
.cal-cell.today .cal-num{color:#fff}
.cal-cell.today{background:var(--brand)}
.cal-cell.sel{outline:2px solid var(--brand);outline-offset:-2px}
.cal-cell.today.sel{outline-color:#fff}
.cal-badge{font-size:9px;font-weight:700;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:1px 5px;line-height:1.5}
.cal-cell.has .cal-badge{color:var(--brand);background:var(--brand-light)}
.cal-cell.today .cal-badge{color:#fff;background:rgba(255,255,255,.25)}
.cal-badge.empty{background:none;color:var(--border-strong);padding:1px 4px}
.cal-hint{text-align:center;color:var(--muted);font-size:13px;padding:22px 16px;line-height:1.6}
.daylist{margin-top:18px}
.daylist-head{font-size:14px;font-weight:700;color:var(--brand);margin:0 2px 12px;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Poppins",sans-serif}
.dayword{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--sh-card);margin-bottom:10px;overflow:hidden}
.dayword.open{border-color:var(--brand)}
.dayword-top{width:100%;text-align:left;padding:14px 16px;background:none;border:none;display:block}
.dw-main{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dw-word{font-size:16px;font-weight:700;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Poppins",sans-serif}
.dw-type{font-size:11px;font-weight:600;color:var(--brand);background:var(--brand-light);border-radius:999px;padding:2px 9px}
.dw-vi{font-size:14px;color:var(--muted);margin-top:4px}
.dw-caret{position:absolute;right:16px;top:16px;color:var(--muted);font-size:13px}
.dayword-top{position:relative}
.dayword-body{padding:0 16px 16px;border-top:1px solid var(--border);margin-top:2px;padding-top:14px}
.dw-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.dw-notes{background:var(--surface-2);border-radius:14px;padding:12px 14px}
.dw-notes-lbl{font-size:12px;font-weight:700;color:var(--brand);margin-bottom:8px}
.dw-note{font-size:14px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.dw-note:last-child{margin-bottom:0;padding-bottom:0;border-bottom:none}
.dw-note .bad{color:var(--danger);text-decoration:line-through}
.dw-note .good{color:var(--success);font-weight:600}
.dw-note-reason{font-size:12px;color:var(--muted);margin-top:4px}
.dw-note-mine{font-size:13px;color:var(--ink);background:var(--brand-light);border-radius:10px;padding:8px 10px;margin-top:6px;line-height:1.5}
.dw-note-example{font-size:12px;color:var(--muted);margin-top:5px}
.dw-note-example i{color:var(--brand);font-style:normal;font-weight:600}
.dw-note-edit{font-size:12px;font-weight:600;color:var(--brand);margin-top:8px;padding:4px 0;display:inline-block}
.empty .e{font-size:40px;margin-bottom:10px}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(160px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:var(--surface);border:1px solid var(--border-strong);border-radius:999px;padding:10px 18px;font-size:13px;
  font-weight:600;box-shadow:var(--sh-float);z-index:60;opacity:0;pointer-events:none;transition:all .3s;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Practice */
/* Phase 3 — AI */
.ai-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11px;
  font-weight:700;background:linear-gradient(135deg,var(--brand),#a855f7);color:#fff}
.local-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11px;
  font-weight:600;background:var(--surface-2);color:var(--muted)}
.spin{width:20px;height:20px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:999px;
  display:inline-block;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:16px;color:var(--muted)}
.loading-wrap .spin{width:34px;height:34px;border-color:var(--surface-2);border-top-color:var(--brand)}
.banner{display:flex;align-items:center;gap:10px;background:var(--warn-bg);border:1px solid var(--warn);
  border-radius:14px;padding:11px 14px;font-size:13px;color:var(--ink);margin-bottom:14px;line-height:1.5}
.err-card{background:var(--danger-bg);border:1px solid var(--danger);border-radius:var(--r-card);padding:18px;text-align:center}
.err-card .e{font-size:34px;margin-bottom:8px}
.key-input{width:100%;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:11px;
  padding:11px 13px;color:var(--ink);font-size:16px;outline:none;font-family:monospace;margin-bottom:10px}
.key-input:focus{border-color:var(--brand)}
.link{color:var(--brand);text-decoration:underline;font-weight:600}

/* Practice inline dưới flashcard */
.practice-inline{margin-top:8px}
.practice-inline .head{display:flex;align-items:center;gap:8px;margin:22px 4px 12px}
.practice-inline .head .t{font-size:15px;font-weight:700}
.ex-tabs{display:flex;gap:8px;margin-bottom:12px}
.ex-tab{flex:1;min-height:48px;padding:9px 6px;border-radius:12px;background:var(--surface-2);color:var(--muted);
  font-size:13px;font-weight:600;text-align:center;border:1.5px solid transparent;
  transition:transform .18s cubic-bezier(.34,1.56,.64,1),background .2s,border-color .2s,color .2s}
.ex-tab:active{transform:scale(.95)}
.ex-tab.active{background:var(--brand-light);color:var(--brand);border-color:var(--brand)}
.ex-tab.done{color:var(--success)}
.mini-result{border-radius:14px;padding:14px;margin-top:12px;border:1px solid var(--border)}
.mini-result .top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.mini-result .sc{font-size:26px;font-weight:800;line-height:1}
.mini-result .fixes{margin-top:8px}
.mini-fb{font-size:13px;line-height:1.6;margin-top:4px}

/* Mức độ đề + gợi ý từ */
.lvl-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700}
.lvl-medium{background:var(--success-bg);color:var(--success)}
.lvl-good{background:var(--warn-bg);color:var(--warn)}
.lvl-hard{background:var(--danger-bg);color:var(--danger)}
.hint-panel{background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:14px;margin:12px 0}
.lookup-panel{background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:14px;margin:12px 0}
.lookup-panel .lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--brand)}
.lk-inputrow{display:flex;gap:8px;align-items:stretch}
.lk-input{flex:1;min-width:0;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;
  padding:11px 12px;color:var(--ink);font-size:16px}
.lk-input:focus{outline:none;border-color:var(--brand)}
.lk-result{margin-top:12px;background:var(--brand-light);border:1px solid var(--brand);border-radius:14px;padding:12px 14px}
.lk-pair{display:flex;align-items:center;gap:10px}
.lk-en{font-size:17px;font-weight:700;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Poppins",sans-serif}
.lk-vi{font-size:14px;color:var(--muted);margin-top:3px}
.lk-sound{width:30px;height:30px;flex:none;border-radius:999px;display:flex;align-items:center;justify-content:center;
  background:var(--surface);border:1px solid var(--border);color:var(--brand)}
.lk-note{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.5}
.hint-panel .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;margin-bottom:10px}
.hint-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.hint-item:last-child{border-bottom:none}
.hint-item .en{font-weight:600;font-size:14px}
.hint-item .vi{font-size:12px;color:var(--muted)}
.hint-item .acts{display:flex;gap:6px;flex:none}
.hint-btn{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  background:var(--surface);border:1px solid var(--border-strong);font-size:15px}
.hint-btn:active{transform:scale(.9)}
.hint-btn.saved{background:var(--brand);color:#fff;border-color:var(--brand)}

.target-box{background:var(--brand-light);border:1px solid var(--brand);border-radius:var(--r-card);
  padding:18px;text-align:center;margin-bottom:14px}
.target-box .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--brand);font-weight:600;margin-bottom:8px}
.target-box .w{font-size:24px;font-weight:700;color:var(--ink);line-height:1.2}
.prompt-vi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);
  padding:16px;margin-bottom:14px;box-shadow:var(--sh-card)}
.prompt-vi .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;margin-bottom:8px}
.prompt-vi .txt{font-size:16px;line-height:1.5;font-weight:500}
.answer-area{width:100%;min-height:110px;background:var(--surface);border:1px solid var(--border-strong);
  border-radius:var(--r-card);padding:16px;color:var(--ink);font-size:16px;line-height:1.6;resize:none;
  outline:none;margin-bottom:14px;font-family:inherit}
.answer-area:focus{border-color:var(--brand)}
.answer-area::placeholder{color:var(--muted)}

/* Result */
.score-ring{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px 0 4px}
.score-ring .num{font-size:52px;font-weight:800;line-height:1}
.score-ring .verdict{font-size:16px;font-weight:600;margin-top:6px}
.breakdown{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.bk{background:var(--surface-2);border-radius:14px;padding:12px 14px}
.bk .k{font-size:12px;color:var(--muted);margin-bottom:6px}
.bk .v{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600}
.bar-mini{height:6px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;margin-top:8px}
html.light .bar-mini{background:rgba(0,0,0,.08)}
.bar-mini>i{display:block;height:100%;border-radius:999px}
.fix-card{background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.fix-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.fix-tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--brand);
  background:var(--brand-light);border-radius:999px;padding:3px 10px}
.fix-row{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;flex-wrap:wrap}
.fix-row .arw{color:var(--muted);font-weight:400}
.fix-row .bad{color:var(--danger);text-decoration:line-through;opacity:.8}
.fix-row .good{color:var(--success);font-weight:700}
.fix-reason{font-size:13px;color:var(--ink);margin-top:6px;line-height:1.5}
.fix-tip{font-size:13px;color:var(--ink);margin-top:7px;line-height:1.5}
.fix-tip b{color:var(--brand);font-weight:700}
.fix-example{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.5}
.fix-example i{color:var(--brand);font-style:normal;font-weight:600}
.note-save-btn{flex:none;font-size:11px;font-weight:600;padding:5px 10px;border-radius:999px;
  background:var(--surface);color:var(--brand);border:1px solid var(--border);transition:transform .15s}
.note-save-btn:active{transform:scale(.92)}
.note-save-btn.saved{background:var(--success-bg);color:var(--success);border-color:var(--success)}
.note-day{margin-bottom:20px}
.note-day-label{font-size:13px;font-weight:700;color:var(--brand);margin:0 2px 10px;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Poppins",sans-serif}
.note-item{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--border);
  border-radius:14px;box-shadow:var(--sh-card);padding:14px 16px;margin-bottom:10px}
.note-item.note-manual{background:var(--brand-light);border-color:var(--brand)}
.note-body{flex:1;min-width:0}
.note-fix{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:15px;font-weight:600}
.note-fix .bad{color:var(--danger);text-decoration:line-through}
.note-fix .good{color:var(--success)}
.note-fix .arw{color:var(--muted)}
.note-reason{font-size:13px;color:var(--ink);margin-top:6px;line-height:1.5}
.note-mine{font-size:14px;color:var(--ink);background:var(--brand-light);border-radius:12px;padding:10px 12px;margin-top:8px;line-height:1.5;font-weight:500}
.note-example{font-size:12.5px;color:var(--muted);margin-top:6px}
.note-example i{color:var(--brand);font-style:normal;font-weight:600}
.note-sent{font-size:12px;color:var(--muted);margin-top:6px;font-style:italic}
.note-word{font-size:12px;color:var(--muted);margin-top:3px}
.note-tag{display:inline-block;font-size:11px;font-weight:700;color:var(--brand);background:var(--surface);
  padding:2px 8px;border-radius:999px;margin-right:6px}
.note-del{flex:none;width:32px;height:32px;border-radius:999px;display:flex;align-items:center;justify-content:center;
  background:var(--surface-2);color:var(--muted);border:1px solid var(--border);transition:transform .15s,color .15s}
.note-del:hover{color:var(--danger)}
.note-del:active{transform:scale(.9)}
.corrected-box{background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-top:10px}
.corrected-box .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;margin-bottom:6px}
.corrected-box .txt{font-size:14px;line-height:1.6}
.best-box{background:var(--brand-light);border:1px solid var(--brand);border-radius:14px;padding:12px 14px;margin-top:10px}
.best-box .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--brand);font-weight:700;margin-bottom:6px}
.best-box .txt{font-size:15px;line-height:1.55;font-weight:500;color:var(--ink)}
.best-box .acts{display:flex;gap:8px;margin-top:10px}
.hl-change{background:var(--success-bg);color:var(--success);border-radius:4px;padding:0 3px;font-weight:600}
.natural{background:var(--success-bg);border:1px solid var(--success);border-radius:var(--r-card);padding:14px;margin-top:4px}
.natural .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--success);font-weight:600;margin-bottom:6px}
.natural .txt{font-size:15px;line-height:1.5}
.struggle{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--border)}

/* ── Active Recall session (mục AB) ── */
.rv-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.rv-progress{font-size:13px;color:var(--muted);font-weight:600;text-align:center;flex:1}
.rv-tier{font-size:18px}
.rv-bar{height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin-bottom:20px}
.rv-bar>i{display:block;height:100%;background:var(--brand-grad);border-radius:999px;transition:width .4s ease-out}
.rv-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--sh-card);padding:22px}
.rv-chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--brand);
  background:var(--brand-light);border-radius:999px;padding:4px 11px;margin-bottom:18px}
.rv-prompt{margin-bottom:18px}
.rv-q-label{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;margin-bottom:10px}
.rv-q-vi{font-size:26px;font-weight:700;line-height:1.25;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Poppins",sans-serif}
.rv-q-en{font-size:30px;font-weight:700;line-height:1.15;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Poppins",sans-serif}
.rv-q-ctx{font-size:19px;font-weight:600;line-height:1.5}
.rv-q-ctxvi{font-size:14px;color:var(--muted);margin-top:8px;font-style:italic}
.rv-input{width:100%;min-height:52px;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:14px;
  padding:14px 16px;color:var(--ink);font-size:16px;line-height:1.5;resize:none;outline:none;margin-bottom:14px;font-family:inherit}
.rv-input:focus{border-color:var(--brand)}
.rv-input::placeholder{color:var(--muted)}
.rv-tip{font-size:12.5px;color:var(--muted);text-align:center;margin-top:14px;line-height:1.5}
.rv-sound{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--brand);
  background:var(--surface-2);border-radius:999px;padding:8px 14px;margin-top:12px;min-height:40px}
.rv-answer{text-align:center;padding:6px 0 4px}
.rv-verdict{font-size:14px;font-weight:600;margin-bottom:12px}
.rv-verdict.ok{color:var(--success)}
.rv-verdict.no{color:var(--muted)}
.rv-ans-en{font-size:30px;font-weight:700;color:var(--ink);line-height:1.2;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Poppins",sans-serif}
.rv-ans-ipa{font-size:15px;color:var(--muted);margin-top:4px}
.rv-ans-vi{font-size:24px;font-weight:700;color:var(--brand);line-height:1.25}
.rv-assess-label{font-size:13px;color:var(--muted);text-align:center;margin:22px 0 12px;font-weight:600}
.rv-assess{display:flex;gap:8px}
.rv-a{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:14px 6px;border-radius:14px;
  background:var(--surface-2);border:1px solid var(--border);font-size:22px;min-height:72px;justify-content:center;
  transition:transform .15s,border-color .2s}
.rv-a span{font-size:11.5px;font-weight:600;color:var(--muted)}
.rv-a:active{transform:scale(.94)}
.rv-a-no:active{border-color:var(--danger)}
.rv-a-mid:active{border-color:var(--warn)}
.rv-a-yes:active{border-color:var(--success)}
.rv-done{text-align:center;padding:30px 16px}
.rv-done-emo{font-size:52px;margin-bottom:8px}
.rv-done h2{font-size:22px;margin-bottom:20px}
.rv-done-stats{display:flex;gap:14px;justify-content:center;margin-bottom:24px}
.rv-done-stat{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px 24px;box-shadow:var(--sh-card)}
.rv-done-stat b{display:block;font-size:30px;line-height:1}
.rv-done-stat span{font-size:12px;color:var(--muted);margin-top:4px;display:block}
.rv-done .btn{margin-bottom:10px}
/* Memory strength trong Progress (mục U) */
.mem-break{display:flex;gap:10px;margin-top:12px}
.mem-cell{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 10px;text-align:center;box-shadow:var(--sh-card)}
.mem-cell b{display:block;font-size:22px;line-height:1;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Poppins",sans-serif}
.mem-cell span{font-size:11px;color:var(--muted);margin-top:5px;display:block}

/* ===== Sổ tay lỗi — Error Review Deck (mục 3-10) ===== */
.err-summary{text-align:center;padding:22px 18px}
.err-summary-n{font-size:19px;font-weight:700;margin-bottom:12px}
.err-summary-tiers{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.err-tier-chip{font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--surface-2);color:var(--ink)}
.err-tier-chip.weak{background:var(--danger-bg);color:var(--danger)}
.err-tier-chip.dev{background:var(--warn-bg);color:var(--warn)}
.err-tier-chip.strong{background:var(--success-bg);color:var(--success)}
.err-you-wrote{font-size:13px;color:var(--muted);margin-top:4px}
.err-bad-big{font-size:22px;font-weight:700;color:var(--danger);margin-top:8px;line-height:1.35;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Poppins",sans-serif}
.err-good-big{font-size:22px;font-weight:700;color:var(--success);line-height:1.35;margin-bottom:12px;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Poppins",sans-serif}
.err-mynote{background:var(--brand-light);border:1px solid var(--brand);border-radius:14px;padding:12px 14px;margin:10px 0}
.err-mynote-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--brand);font-weight:700;margin-bottom:5px}
.err-mynote-txt{font-size:15px;line-height:1.5;color:var(--ink);margin-bottom:8px}
.err-mini{background:var(--surface-2);border-radius:14px;padding:14px;margin-top:16px}
.err-mini-lbl{font-size:13px;font-weight:700;margin-bottom:4px}
.err-mini-hint{font-size:12.5px;color:var(--muted);margin-bottom:10px;line-height:1.5}
.err-mini-result{font-size:13px;font-weight:600;margin-top:8px;padding:8px 10px;border-radius:10px}
.err-mini-result.ok{background:var(--success-bg);color:var(--success)}
.err-mini-result.no{background:var(--surface);color:var(--muted)}
/* Card "Ôn tập hôm nay" trên Home + Review */
.review-cta{background:var(--brand-grad);border:none;color:#fff;border-radius:var(--r-card);padding:20px;
  box-shadow:var(--sh-glow);margin-bottom:16px;width:100%;text-align:left;transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
.review-cta:active{transform:scale(.97)}
.review-cta .k{font-size:12px;opacity:.9;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.review-cta .v{font-size:19px;font-weight:700;margin:6px 0 3px;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Poppins",sans-serif}
.review-cta .p{font-size:12.5px;opacity:.9}
.weak-card{background:var(--danger-bg);border:1px solid var(--danger);border-radius:var(--r-card);padding:16px 18px;
  margin-bottom:16px;width:100%;text-align:left;display:flex;align-items:center;gap:12px;transition:transform .18s}
.weak-card:active{transform:scale(.98)}
.weak-card .wc-body{flex:1}
.weak-card .wc-t{font-size:15px;font-weight:700;color:var(--ink)}
.weak-card .wc-s{font-size:12.5px;color:var(--muted);margin-top:2px}
.weak-card .wc-arrow{color:var(--danger);font-size:18px}
.struggle:last-child{border-bottom:none}
.struggle .sig{font-size:16px}

.fade{animation:fade .3s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
::-webkit-scrollbar{width:0}
</style>

<script>
// CHỈ dùng visualViewport để PHÁT HIỆN bàn phím đang mở/đóng (bật/tắt class kb-open để
// ẩn/hiện thanh điều hướng + FAB). KHÔNG dùng để đo/đổi chiều cao app liên tục — chiều cao
// app đã giao hoàn toàn cho CSS (100dvh) tự xử lý, trình duyệt lo phần đó tốt hơn JS.
(function(){
  if(!window.visualViewport) return;
  function onVVResize(){
    var vv = window.visualViewport;
    var kb = vv.height < window.innerHeight - 120; // chênh lệch lớn = bàn phím đang mở
    document.body.classList.toggle('kb-open', kb);
  }
  window.visualViewport.addEventListener('resize', onVVResize);
  onVVResize();
})();
</script>

/* Mỗi item đủ trường theo spec: word,type,level,meaningVi,definitionEn,pronunciation,

/* =================================================================
   STORAGE LAYER — localStorage, đơn giản, có default an toàn
================================================================= */
const KEY = 'english-coach-v1';
const todayStr = () => new Date().toISOString().slice(0,10);
const defaultData = () => ({
  learned:{},            // { vocabId: {ts, box, firstDay} }
  reviewQueue:{},        // { vocabId: nextReviewDate }
  dailyGoal:5,
  progressToday:{ date:todayStr(), count:0 },
  streak:{ count:0, lastDay:null },
  sentencesPracticed:0,
  practiceScores:[],      // [{ts, score}] để tính điểm luyện trung bình
  mistakes:{},            // { vocabId: count } — "Words I struggle with"
  myWords:[],             // [{id, word, meaningVi, ts}] — từ tự lưu khi luyện
  notes:[],               // [{id, ts, kind:'fix'|'manual', bad, good, reason, sentence, word, text}] — Ghi chú lỗi
  generatedExercises:{},  // { vocabId: [{promptVi,targetPhrase,difficulty,context,grammarFocus,ts}] } — cache đề AI sinh (chống lặp, giảm gọi AI)
  // ── KHOA HỌC GHI NHỚ (bổ sung — Active Recall / Smart Review / Memory Strength / Weak Word) ──
  memory:{},              // { vocabId: {strength 0-100, lastRecall, recallSuccess, recallFail, consecutive, lastPractice, ts} }
  reviewLimit:5,          // số từ mỗi phiên Ôn tập thông minh (5/10/15, mặc định 5 — mục S)
  theme:'dark',
  geminiKey:'',
  geminiModel:'',
});
let DATA = load();
function load(){
  try{ const raw=localStorage.getItem(KEY); if(!raw) return defaultData();
    return { ...defaultData(), ...JSON.parse(raw) }; }
  catch(e){ return defaultData(); }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(DATA)); }catch(e){} }

function markLearned(id){
  const prev = DATA.learned[id];
  const first = !prev;
  DATA.learned[id] = {
    ts: Date.now(),
    box: (prev?.box||0)+1,
    firstDay: prev?.firstDay || todayStr()   // ngày học lần đầu (không đổi khi học lại)
  };
  if(first){ bumpDaily(); }
  bumpStreak();
  save();
}
function bumpDaily(){
  if(DATA.progressToday.date!==todayStr()) DATA.progressToday={date:todayStr(),count:0};
  DATA.progressToday.count++;
}
function bumpStreak(){
  const t=todayStr();
  if(DATA.streak.lastDay===t) return;
  const yest=new Date(Date.now()-864e5).toISOString().slice(0,10);
  DATA.streak.count = (DATA.streak.lastDay===yest)? DATA.streak.count+1 : 1;
  DATA.streak.lastDay=t;
}
const learnedCount = () => Object.keys(DATA.learned).length;
// Kho từ đầy đủ = VOCAB cố định + "Từ của tôi" (động, do người dùng lưu)
function myWordsAsVocab(){
  return (DATA.myWords||[]).map(w=>({
    id:w.id, topic:'mywords', word:w.word, type:w.type||'', level:w.level||'',
    meaningVi:w.meaningVi||'', definitionEn:w.definitionEn||'',
    pronunciation:w.pronunciation||'', exampleEn:w.exampleEn||'', exampleVi:w.exampleVi||'',
    collocations:w.collocations||[],
    targetExercises:[{ promptVi:'Hãy tự đặt một câu tiếng Anh có dùng "'+w.word+'".', targetPhrase:w.word }],
    _mine:true,
  }));
}
function allVocab(){ return VOCAB.concat(myWordsAsVocab()); }
const findVocab = id => allVocab().find(v=>v.id===id);
const topicLearned = tid => allVocab().filter(v=>v.topic===tid && DATA.learned[v.id]).length;
const topicTotal   = tid => allVocab().filter(v=>v.topic===tid).length;

function recordPractice(vocabId, score, passed){
  DATA.sentencesPracticed = (DATA.sentencesPracticed||0)+1;
  DATA.practiceScores = (DATA.practiceScores||[]).concat({ ts:Date.now(), score }).slice(-100);
  if(!passed){ DATA.mistakes[vocabId] = (DATA.mistakes[vocabId]||0)+1; }
  else if(DATA.mistakes[vocabId]){ DATA.mistakes[vocabId] = Math.max(0, DATA.mistakes[vocabId]-1); if(!DATA.mistakes[vocabId]) delete DATA.mistakes[vocabId]; }
  applyPracticeToMemory(vocabId, score, passed); // cập nhật memory strength (mục H) — không đổi logic chấm
  bumpStreak();
  save();
}
const avgPracticeScore = () => {
  const s=(DATA.practiceScores||[]); if(!s.length) return 0;
  return Math.round(s.reduce((a,b)=>a+b.score,0)/s.length);
};
const struggleList = () => Object.entries(DATA.mistakes||{})
  .map(([id,c])=>({ v:findVocab(id), count:c })).filter(x=>x.v)
  .sort((a,b)=>b.count-a.count);

/* =================================================================
   MEMORY ENGINE — Active Recall, Memory Strength, Smart Review, Weak Words
   Toàn bộ chạy LOCAL (không gọi Gemini để chọn từ/tính điểm — mục AG).
   Dữ liệu lưu ở DATA.memory[id]; tự MIGRATION an toàn từ dữ liệu cũ (mục AE).
================================================================= */
// Lấy (hoặc khởi tạo lazily) bản ghi trí nhớ cho 1 từ. Nếu chưa có → suy ra strength ban đầu
// từ dữ liệu cũ (learned.box + mistakes) để người đang dùng không bị "mất trắng" tiến trình.
function memOf(id){
  if(!DATA.memory) DATA.memory={};
  if(!DATA.memory[id]){
    const learned = DATA.learned[id];
    const miss = DATA.mistakes[id]||0;
    let strength = 0;
    if(learned){
      // box càng cao = đã ôn/nhớ nhiều lần → strength nền cao hơn; trừ hao theo số lần sai
      strength = Math.max(10, Math.min(80, (learned.box||1)*18 - miss*10));
    }
    DATA.memory[id] = {
      strength,
      lastRecall: null,
      recallSuccess: 0,
      recallFail: 0,
      consecutive: 0,
      lastPractice: learned?.ts || null,
      ts: Date.now(),
    };
  }
  return DATA.memory[id];
}
// Phân tầng strength → nhãn đơn giản (mục G): 🔴 Yếu / 🟡 Đang nhớ / 🟢 Nhớ rõ
function strengthTier(s){
  if(s>=75) return {key:'strong', label:'Nhớ rõ', icon:'🟢', color:'var(--success)'};
  if(s>=40) return {key:'developing', label:'Đang nhớ', icon:'🟡', color:'var(--warn)'};
  return {key:'weak', label:'Cần ôn', icon:'🔴', color:'var(--danger)'};
}
// Cập nhật trí nhớ sau một lần RECALL. level: 0=không nhớ, 1=lờ mờ, 2=nhớ rõ (mục H)
function applyRecall(id, level){
  const m = memOf(id);
  m.lastRecall = Date.now();
  m.ts = Date.now();
  if(level>=2){        // nhớ rõ → tăng mạnh
    m.strength = Math.min(100, m.strength + 14);
    m.recallSuccess++; m.consecutive++;
    if(DATA.mistakes[id]){ DATA.mistakes[id]=Math.max(0,DATA.mistakes[id]-1); if(!DATA.mistakes[id]) delete DATA.mistakes[id]; }
  } else if(level===1){ // lờ mờ → tăng nhẹ, không reset chuỗi hẳn
    m.strength = Math.min(100, m.strength + 5);
    m.recallSuccess++; m.consecutive=Math.max(0,m.consecutive);
  } else {              // không nhớ → giảm mạnh, đánh dấu là từ yếu
    m.strength = Math.max(0, m.strength - 18);
    m.recallFail++; m.consecutive=0;
    DATA.mistakes[id] = (DATA.mistakes[id]||0)+1;
  }
  scheduleAdaptive(id);
  save();
}
// Cập nhật trí nhớ sau khi LUYỆN ĐẶT CÂU (dùng điểm chấm sẵn có — không đổi Practice engine, mục W)
function applyPracticeToMemory(id, score, passed){
  const m = memOf(id);
  m.lastPractice = Date.now(); m.ts = Date.now();
  if(passed && score>=70){ m.strength = Math.min(100, m.strength + 8); m.consecutive++; }
  else if(score>=50){ m.strength = Math.min(100, m.strength + 2); }
  else { m.strength = Math.max(0, m.strength - 8); m.consecutive=0; }
  scheduleAdaptive(id);
}
// Khoảng cách ôn thích ứng theo độ nhớ (mục I) — vẫn ghi vào reviewQueue cũ để tương thích.
function adaptiveInterval(strength){
  if(strength>=85) return 14 + Math.round(Math.random()*16); // 14–30 ngày
  if(strength>=75) return 7 + Math.round(Math.random()*7);   // 7–14
  if(strength>=40) return 2 + Math.round(Math.random()*2);   // 2–4
  return 1;                                                   // yếu: ôn lại sau 1 ngày
}
function scheduleAdaptive(id){
  const days = adaptiveInterval(memOf(id).strength);
  DATA.reviewQueue[id] = new Date(Date.now()+days*864e5).toISOString().slice(0,10);
}
function daysSinceRecall(id){
  const m=memOf(id);
  const base = m.lastRecall || m.lastPractice || DATA.learned[id]?.ts;
  if(!base) return 999;
  return Math.floor((Date.now()-base)/864e5);
}
// Điểm ưu tiên ôn (mục E/P): từ yếu + quá hạn + lâu chưa gặp + chưa từng recall → điểm cao hơn.
function reviewPriority(id){
  const m = memOf(id);
  const t = todayStr();
  let score = 0;
  score += (100 - m.strength) * 1.5;              // càng yếu càng ưu tiên (lớn nhất)
  const nd = DATA.reviewQueue[id];
  if(nd){ const overdue = Math.floor((Date.parse(t)-Date.parse(nd))/864e5); if(overdue>0) score += overdue*8; } // quá hạn
  score += (DATA.mistakes[id]||0) * 12;           // hay sai
  score += Math.min(daysSinceRecall(id), 30);     // lâu chưa gặp
  if(!m.lastRecall) score += 15;                  // chưa từng recall bao giờ
  score -= m.consecutive * 4;                      // nhớ liên tiếp nhiều → giãn ra
  return score;
}
// Trộn để không dồn cùng 1 topic liên tiếp (mục L) — xoay vòng theo topic.
function interleaveByTopic(list){
  const byTopic={};
  list.forEach(v=>{ (byTopic[v.topic]=byTopic[v.topic]||[]).push(v); });
  const buckets=Object.values(byTopic);
  const out=[]; let added=true;
  while(added){ added=false; for(const b of buckets){ if(b.length){ out.push(b.shift()); added=true; } } }
  return out;
}
// Chọn pool ôn thông minh (mục D/M/P): xếp theo priority, lấy limit từ, ưu tiên từ yếu,
// chèn 1 từ mạnh để kiểm tra duy trì, rồi interleave topic.
function getSmartReviewPool(limit){
  limit = limit || DATA.reviewLimit || 5;
  const learned = allVocab().filter(v=>DATA.learned[v.id]);
  if(!learned.length) return [];
  const ranked = learned.map(v=>({v, p:reviewPriority(v.id), s:memOf(v.id).strength}))
                        .sort((a,b)=>b.p-a.p);
  // lấy phần lớn từ nhóm ưu tiên cao (yếu/quá hạn), chừa 1 slot cho 1 từ "mạnh" để kiểm tra duy trì
  const strongOnes = ranked.filter(x=>x.s>=75);
  let chosen = ranked.slice(0, limit).map(x=>x.v);
  if(strongOnes.length && limit>=4 && !chosen.some(v=>memOf(v.id).strength>=75)){
    chosen[chosen.length-1] = strongOnes[Math.floor(Math.random()*strongOnes.length)].v; // thay slot cuối bằng 1 từ mạnh
  }
  return interleaveByTopic(chosen);
}
// Danh sách "Từ tôi đang yếu" (mục J): kết hợp mistakes + memory strength thấp.
function weakWordList(){
  const ids = new Set([
    ...Object.keys(DATA.mistakes||{}),
    ...Object.keys(DATA.memory||{}).filter(id=>memOf(id).strength<40),
  ]);
  return [...ids].map(id=>({ v:findVocab(id), miss:DATA.mistakes[id]||0, strength:memOf(id).strength }))
    .filter(x=>x.v && DATA.learned[x.v.id])
    .sort((a,b)=> (a.strength-b.strength) || (b.miss-a.miss));
}
// Thống kê phân tầng trí nhớ cho màn Tiến độ (mục U).
function memoryBreakdown(){
  const learned = allVocab().filter(v=>DATA.learned[v.id]);
  let strong=0, developing=0, weak=0;
  learned.forEach(v=>{ const t=strengthTier(memOf(v.id).strength).key;
    if(t==='strong') strong++; else if(t==='developing') developing++; else weak++; });
  return {total:learned.length, strong, developing, weak};
}
function smartReviewReadyCount(){ return getSmartReviewPool(DATA.reviewLimit||5).length; }

/* =================================================================
   ERROR NOTEBOOK MEMORY ENGINE — "Sổ tay lỗi" Active Recall Deck
   Lưu chỉ số ghi nhớ TRỰC TIẾP trên từng note (notes vốn đã là mảng có thể sửa,
   khác VOCAB cố định) — đơn giản, không cần map riêng, save() tự serialize đúng.
   Fields mới (lazy, backward-compatible — note cũ không có thì tự khởi tạo an toàn):
   errStrength, errorReviewCount, errorRecallSuccess, errorRecallFail, lastErrorReview
================================================================= */
const fixNotes = () => (DATA.notes||[]).filter(n=>n.kind==='fix');
function errMemOf(n){
  if(n.errStrength==null){
    n.errStrength = 20;            // lỗi mới lưu → coi như còn yếu, cần ôn sớm
    n.errorReviewCount = 0;
    n.errorRecallSuccess = 0;
    n.errorRecallFail = 0;
    n.lastErrorReview = null;
  }
  return n;
}
function errTier(n){
  errMemOf(n);
  if(n.errStrength>=75) return {key:'strong', label:'Đã nhớ', emoji:'🟢', color:'var(--success)'};
  if(n.errStrength>=40) return {key:'developing', label:'Đang học', emoji:'🟡', color:'var(--warn)'};
  return {key:'weak', label:'Cần nhớ', emoji:'🔴', color:'var(--danger)'};
}
// Cập nhật sau 1 lần tự đánh giá trong Error Deck. level: 0=chưa nhớ,1=lờ mờ,2=nhớ rồi
function applyErrorRecall(n, level){
  errMemOf(n);
  n.lastErrorReview = Date.now();
  n.errorReviewCount++;
  if(level>=2){ n.errStrength=Math.min(100,n.errStrength+18); n.errorRecallSuccess++; }
  else if(level===1){ n.errStrength=Math.min(100,n.errStrength+6); n.errorRecallSuccess++; }
  else { n.errStrength=Math.max(0,n.errStrength-20); n.errorRecallFail++; }
  save();
}
// Ưu tiên ôn (mục 12): sai nhiều lần (cùng bad/good lặp ở nhiều note) > chưa từng review > mới sai gần đây > memory yếu
function errorPriority(n){
  errMemOf(n);
  let score = (100 - n.errStrength) * 1.3;                 // càng yếu càng ưu tiên
  if(!n.lastErrorReview) score += 28;                       // chưa từng ôn
  const repeatCount = fixNotes().filter(x=>x.bad===n.bad && x.good===n.good).length;
  score += Math.min(30, (repeatCount-1)*15);                // lặp lại nhiều lần
  const daysSince = n.ts? Math.floor((Date.now()-n.ts)/864e5) : 99;
  if(daysSince<=2) score += 10;                             // mới sai gần đây
  return score;
}
function errorSummaryStats(){
  const list = fixNotes();
  let weak=0, dev=0, strong=0;
  list.forEach(n=>{ const k=errTier(n).key; if(k==='weak')weak++; else if(k==='developing')dev++; else strong++; });
  return { total:list.length, weak, developing:dev, strong };
}
function todayErrorCount(){
  const t0 = new Date(); t0.setHours(0,0,0,0);
  return fixNotes().filter(n=>n.ts>=t0.getTime()).length;
}
// Chọn tối đa `limit` lỗi để ôn, sắp theo ưu tiên giảm dần (mục 9: session 3–10 lỗi)
const ERR_SESSION_SIZE = 10;
function getErrorReviewPool(limit){
  limit = limit || ERR_SESSION_SIZE;
  const list = fixNotes();
  if(!list.length) return [];
  return list.map(n=>({n,p:errorPriority(n)})).sort((a,b)=>b.p-a.p).slice(0,limit).map(x=>x.n);
}

const GEMINI_MODELS = ['gemini-3.5-flash-lite','gemini-2.5-flash-lite','gemini-3.5-flash','gemini-2.5-flash'];

// Tương thích ngược + tự gán mức độ theo vị trí đề (1=medium,2=good,3=hard)
const EX_LEVELS = ['medium','good','hard'];
const LEVEL_VI = { medium:'Trung bình', good:'Khá', hard:'Khó' };
function getExercises(v){
  let list = Array.isArray(v.targetExercises)? v.targetExercises
           : (v.targetExercise? [v.targetExercise] : []);
  return list.map((ex,i)=>({ ...ex, level: ex.level || EX_LEVELS[Math.min(i,2)] }));
}

function buildPrompt(sentence, vocab, ex){
  ex = ex || getExercises(vocab)[0] || {targetPhrase:vocab.word, promptVi:''};
  return `Bạn là giáo viên tiếng Anh giàu kinh nghiệm, dạy người Việt MỚI BẮT ĐẦU học. Hãy chấm và CHỮA câu tiếng Anh do học viên viết.

TỪ/CỤM MỤC TIÊU (bắt buộc phải xuất hiện trong câu): "${ex.targetPhrase}"
GỢI Ý NGHĨA (tiếng Việt) mà học viên cần diễn đạt: "${ex.promptVi}"
CÂU HỌC VIÊN VIẾT: "${sentence}"

Hãy chấm theo 5 tiêu chí, mỗi tiêu chí 0-100:
- meaningScore: có truyền đạt đúng ý câu tiếng Việt không (chấp nhận cách diễn đạt khác, KHÔNG so khớp từng chữ).
- grammarScore: ngữ pháp đúng không.
- vocabularyScore: dùng từ phù hợp; nếu KHÔNG dùng cụm mục tiêu thì tối đa 30.
- naturalnessScore: có tự nhiên như người bản ngữ không.
- score: điểm tổng 0-100 (nếu thiếu cụm mục tiêu thì tối đa 55).

QUAN TRỌNG — hãy làm thật kỹ 3 việc sau:

1) SỬA LỖI (mảng "fixes"): Chỉ liệt kê TỐI ĐA 3 lỗi QUAN TRỌNG NHẤT (KHÔNG liệt kê 8-10 lỗi). Ưu tiên: (1) lỗi làm sai NGHĨA, (2) lỗi ngữ pháp cơ bản, (3) lỗi dùng sai/thiếu từ mục tiêu, (4) collocation, (5) thiếu tự nhiên. Mỗi lỗi gồm 5 phần NGẮN GỌN:
   - "category": MỘT từ khóa IN HOA (tiếng Anh) đặt tên loại lỗi, chọn 1 trong: GRAMMAR, PREPOSITION, ARTICLE, TENSE, PLURAL, WORD ORDER, COLLOCATION, VOCABULARY, NATURALNESS, TARGET WORD, SPELLING.
   - "bad": đúng phần sai trong câu gốc (từ/cụm sai, KHÔNG chép cả câu).
   - "good": phần đã sửa đúng.
   - "memoryTip": MỘT mẹo nhớ CỰC NGẮN (tối đa 8 từ), đời thường, KHÔNG thuật ngữ học thuật. Ví dụ: "interested IN", "He/She/It thêm S", "information không đếm được".
   - "example": MỘT ví dụ mini tiếng Anh cực ngắn (3-7 từ) minh hoạ đúng, KHÁC câu học viên. Ví dụ: "I'm interested in AI." Nếu không cần thì để chuỗi rỗng "".
   Nếu câu KHÔNG có lỗi thì "fixes" là mảng rỗng [].

2) CÂU ĐÃ SỬA (correctedSentence): viết lại CHÍNH câu học viên sau khi sửa hết lỗi, GIỮ nguyên ý và cách diễn đạt của họ (chỉ sửa chỗ sai). Vẫn phải chứa cụm mục tiêu.

3) CÂU MẪU TỰ NHIÊN NHẤT (moreNaturalVersion): tự đặt MỘT câu tiếng Anh hoàn chỉnh, tự nhiên như người bản ngữ, hay nhất cho đề bài — bắt buộc dùng cụm mục tiêu "${ex.targetPhrase}".

Mọi giải thích PHẢI bằng tiếng Việt, CỰC NGẮN, dễ hiểu cho người mới — KHÔNG dùng thuật ngữ học thuật ("phân từ", "mệnh đề quan hệ"...).

const sleep = ms => new Promise(r=>setTimeout(r,ms));
// Gọi 1 model. Trả {data} nếu OK; ném lỗi có phân loại (kèm cờ _minute cho 429 tạm thời).
async function callGemini(model, sentence, vocab, ex){
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(DATA.geminiKey.trim())}`;
  const body = {
    contents:[{ parts:[{ text: buildPrompt(sentence, vocab, ex) }] }],
    generationConfig:{ temperature:0.3, responseMimeType:'application/json' }
  };
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), 20000);
  let res;
  try{
    res = await fetch(url,{ method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body), signal:ctrl.signal });
  }catch(e){ clearTimeout(timer); throw new Error(e.name==='AbortError'?'TIMEOUT':'NETWORK'); }
  clearTimeout(timer);
  if(!res.ok){
    let emsg='';
    try{ const ej=await res.json(); emsg=(ej?.error?.message||ej?.error?.status||'')+''; }catch(_){}
    const lm=emsg.toLowerCase();
    if(res.status===404 || lm.includes('not found') || lm.includes('is not supported') || lm.includes('not supported for') || lm.includes('unknown model')){ const er=new Error('MODEL_NOT_FOUND'); er._badModel=true; throw er; }
    if(res.status===401||res.status===403 || lm.includes('api key') || lm.includes('api_key') || lm.includes('permission')) throw new Error('BAD_KEY');
    if(res.status===429 || lm.includes('quota') || lm.includes('rate limit') || lm.includes('resource_exhausted')){
      const er=new Error('RATE_LIMIT');
      // 429 theo NGÀY (RPD) thường có chữ "per day"/"daily"; còn lại coi là theo PHÚT (chờ chút là được)
      er._perDay = /per day|daily|requests? per day|rpd/.test(lm);
      throw er;
    }
    if(res.status===400) throw new Error('BAD_KEY');
    if(res.status>=500) throw new Error('SERVER');
    throw new Error('HTTP_'+res.status);
  }
  return res;
}
async function evaluateWithGemini(sentence, vocab, ex){
  if(!hasKey()) throw new Error('NO_KEY');
  if(!isOnline()) throw new Error('OFFLINE');
  // Danh sách model để thử: model đã lưu (chạy được lần trước) lên đầu, rồi tới các model còn lại.
  const saved = currentModel();
  const models = [saved, ...GEMINI_MODELS.filter(m=>m!==saved)];
  const backoff = [0, 2000, 5000]; // tự chờ 0s → 2s → 5s khi gặp nghẽn theo phút
  let lastErr = new Error('RATE_LIMIT');
  for(const model of models){
    for(let attempt=0; attempt<backoff.length; attempt++){
      if(backoff[attempt]>0) await sleep(backoff[attempt]);
      try{
        const res = await callGemini(model, sentence, vocab, ex);
        DATA.geminiModel = model; try{ save(); }catch(_){}  // nhớ model chạy được
        var okRes = res; break;
      }catch(e){
        lastErr = e;
        if(e._badModel) break;                 // model này không có → sang model kế
        if(e.message==='BAD_KEY') throw e;       // key sai → báo ngay, thử tiếp vô ích
        if(e.message==='OFFLINE') throw e;
        if(e.message==='RATE_LIMIT' && e._perDay) throw new Error('RATE_LIMIT_DAY'); // hết lượt NGÀY → không chờ được
        if(e.message==='RATE_LIMIT'){ continue; }          // nghẽn PHÚT → chờ rồi thử lại
        if(e.message==='SERVER' || e.message==='TIMEOUT' || e.message==='NETWORK'){ continue; }
        // lỗi khác → thử model kế
        break;
      }
    }
    if(typeof okRes!=='undefined' && okRes) { var finalRes = okRes; break; }
  }
  if(typeof finalRes==='undefined' || !finalRes) throw lastErr;
  const data = await finalRes.json();
  let text = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
  text = text.replace(/```json|```/g,'').trim();
  let json;
  try{ json = JSON.parse(text); }
  catch(e){ const m=text.match(/\{[\s\S]*\}/); if(m){ try{ json=JSON.parse(m[0]); }catch(_){}} }
  if(!json || typeof json.score!=='number') throw new Error('PARSE');
  // chuẩn hoá + đảm bảo đủ trường
  const best = json.bestVersion || json.moreNaturalVersion || '';
  return {
    score: clampInt(json.score), meaningScore: clampInt(json.meaningScore),
    grammarScore: clampInt(json.grammarScore), vocabularyScore: clampInt(json.vocabularyScore),
    naturalnessScore: clampInt(json.naturalnessScore),
    targetWordUsed: !!json.targetWordUsed,
    isAcceptable: json.isAcceptable!==undefined? !!json.isAcceptable : (json.score>=70 && !!json.targetWordUsed),
    originalSentence: json.originalSentence || sentence,
    correctedSentence: json.correctedSentence || sentence,
    fixes: Array.isArray(json.fixes)? json.fixes.filter(f=>f&&f.bad&&f.good).slice(0,3).map(f=>({
      bad:f.bad, good:f.good,
      tag:f.category||f.tag||'',            // nhãn hiển thị (schema mới: category; cũ: tag)
      category:f.category||f.tag||'',
      reason:f.memoryTip||f.reason||'',      // "reason" giữ để tương thích hiển thị/ghi chú cũ
      memoryTip:f.memoryTip||f.reason||'',
      example:f.example||''
    })) : [],
    feedback: Array.isArray(json.feedback)? json.feedback.filter(Boolean).slice(0,6) : [],
    explanationVi: json.explanationVi || '',
    bestVersion: best,
    moreNaturalVersion: best, // giữ tương thích UI cũ
    _local: false,
  };
}
function clampInt(n){ n=Math.round(Number(n)||0); return Math.max(0,Math.min(100,n)); }

/* Gợi ý từ/cụm tiếng Anh giúp đặt câu (kèm nghĩa VN). AI nếu có key, else cục bộ. */
async function suggestWordsAI(vocab, ex){
  if(!hasKey() || !isOnline()) throw new Error('NO_AI');
  const url=`https://generativelanguage.googleapis.com/v1beta/models/${currentModel()}:generateContent?key=${encodeURIComponent(DATA.geminiKey.trim())}`;
  const prompt=`Học viên người Việt cần viết câu tiếng Anh sau: "${ex.promptVi}" (bắt buộc dùng "${ex.targetPhrase}").
Gợi ý 5-6 từ hoặc cụm từ tiếng Anh HỮU ÍCH để viết câu này (động từ, danh từ, cụm collocation phù hợp ngữ cảnh, KHÔNG lặp lại chính "${ex.targetPhrase}").
CHỈ trả JSON thuần: {"words":[{"en":"<từ/cụm tiếng Anh>","vi":"<nghĩa tiếng Việt ngắn>"}]}`;
  const ctrl=new AbortController(); const timer=setTimeout(()=>ctrl.abort(),15000);
  let res;
  try{ res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:0.4,responseMimeType:'application/json'}}),
    signal:ctrl.signal}); }
  catch(e){ clearTimeout(timer); throw new Error('NET'); }
  clearTimeout(timer);
  if(!res.ok){ if(res.status===400||res.status===403) throw new Error('BAD_KEY'); throw new Error('HTTP'); }
  const data=await res.json();
  let text=(data?.candidates?.[0]?.content?.parts?.[0]?.text||'').replace(/```json|```/g,'').trim();
  let json; try{ json=JSON.parse(text); }catch(e){ const m=text.match(/\{[\s\S]*\}/); if(m) json=JSON.parse(m[0]); }
  const arr=(json&&json.words)||[];
  return arr.filter(w=>w&&w.en).map(w=>({en:String(w.en).trim(), vi:String(w.vi||'').trim()})).slice(0,6);
}
// Gợi ý cục bộ: collocations + từ trong ví dụ + bộ từ nối hữu ích chung (không cần mạng)
const GENERIC_HINTS = [
  {en:'in order to', vi:'để mà, nhằm'},
  {en:'as well as', vi:'cũng như'},
  {en:'make sure', vi:'đảm bảo'},
  {en:'provide', vi:'cung cấp'},
  {en:'improve', vi:'cải thiện'},
  {en:'reduce', vi:'giảm'},
  {en:'according to', vi:'theo như'},
  {en:'be able to', vi:'có thể'},
];
function suggestWordsLocal(vocab, ex){
  const out=[]; const seen=new Set([ (ex.targetPhrase||'').toLowerCase() ]);
  (vocab.collocations||[]).forEach(c=>{ const k=c.toLowerCase(); if(!seen.has(k)){ seen.add(k); out.push({en:c, vi:''}); } });
  const stop=new Set('the a an to of in on for and or with is are be we our you your it that this needs need every will can may as at by from'.split(' '));
  (vocab.exampleEn||'').replace(/[^a-zA-Z\s-]/g,'').split(/\s+/).forEach(w=>{
    const k=w.toLowerCase(); if(w.length>3 && !stop.has(k) && !seen.has(k)){ seen.add(k); out.push({en:w.toLowerCase(), vi:''}); }
  });
  // luôn bổ sung vài từ nối chung để đủ gợi ý
  for(const g of GENERIC_HINTS){ if(out.length>=6) break; if(!seen.has(g.en.toLowerCase())){ seen.add(g.en.toLowerCase()); out.push(g); } }
  return out.slice(0,6);
}

   Giải pháp: với mức KHÓ, ngoài câu mẫu cố định trong vocabulary (vẫn dùng làm fallback/pool),
   AI có thể sinh thêm câu mới đa dạng ngữ cảnh + cấu trúc, lưu cache theo từng từ để tái dùng
   (không gọi AI mỗi lần), và tránh lặp lại các câu vừa dùng gần đây. */
const EXERCISE_CONTEXTS = ['Đời sống hằng ngày','Du lịch','Công việc','Kinh doanh','Chăm sóc khách hàng',
  'Email công việc','Cuộc họp','Thuyết trình','Công nghệ','Môi trường','Giáo dục','Đàm phán','Giải quyết vấn đề'];
// Hướng dẫn độ khó theo đúng CEFR của từ — tránh biến B1 thành C1 (yêu cầu "level awareness")
const HARD_LEVEL_GUIDE = {
  A1:'Vẫn dùng cấu trúc đơn giản (câu ghép ngắn với and/but/because), từ vựng cơ bản, KHÔNG dùng mệnh đề quan hệ hay bị động phức tạp.',
  A2:'Có thể dùng liên từ (because/although/when), so sánh đơn giản, thì quá khứ/tương lai cơ bản. Chưa dùng bị động phức tạp hay câu điều kiện loại 3.',
  B1:'Có thể dùng mệnh đề quan hệ đơn giản, câu điều kiện (if/unless), thì hoàn thành, bị động cơ bản, liên từ nguyên nhân-kết quả.',
  B2:'Có thể dùng mệnh đề phức, bị động, câu điều kiện, thì hoàn thành, modal verbs, ngữ cảnh công việc/kinh doanh tinh tế, nguyên nhân-kết quả nhiều lớp.',
};
function vocabRecentPrompts(vid){
  const arr=(DATA.generatedExercises && DATA.generatedExercises[vid]) || [];
  return arr.slice(-8).map(e=>e.promptVi).filter(Boolean);
}
// So khớp gần đúng để tránh AI trả câu na ná câu vừa dùng (không cần thư viện ngoài)
function normText(s){ return (s||'').toLowerCase().normalize('NFC').replace(/[^\p{L}\p{N}\s]/gu,'').replace(/\s+/g,' ').trim(); }
function tooSimilar(a, b){
  const na=normText(a), nb=normText(b);
  if(!na || !nb) return false;
  if(na===nb) return true;
  const wa=new Set(na.split(' ')), wb=new Set(nb.split(' '));
  let common=0; wa.forEach(w=>{ if(wb.has(w)) common++; });
  const overlap = common / Math.max(wa.size, wb.size, 1);
  return overlap > 0.72; // trùng hơn ~72% số từ → coi là quá giống
}
function buildExerciseGenPrompt(vocab, difficulty, recentList){
  const context = EXERCISE_CONTEXTS[Math.floor(Math.random()*EXERCISE_CONTEXTS.length)];
  const guide = HARD_LEVEL_GUIDE[vocab.level] || HARD_LEVEL_GUIDE.B1;
  return `Bạn là giáo viên tiếng Anh cho người Việt. Tạo MỘT câu tiếng Việt để học viên dịch sang tiếng Anh.

TỪ/CỤM MỤC TIÊU: "${vocab.word}"
CẤP ĐỘ (CEFR) CỦA TỪ: "${vocab.level}"
NGỮ CẢNH GỢI Ý: "${context}"
ĐỘ KHÓ: "${difficulty}"
GIỚI HẠN NGỮ PHÁP THEO CẤP ĐỘ: ${guide}

CÁC CÂU ĐÃ DÙNG GẦN ĐÂY CHO TỪ NÀY (KHÔNG được lặp nội dung hoặc cấu trúc chính giống các câu này):
${recentList.length? recentList.map(s=>'- '+s).join('\n') : '(chưa có câu nào)'}

YÊU CẦU BẮT BUỘC:
1. Người học phải có LÝ DO TỰ NHIÊN để dùng "${vocab.word}" khi dịch — không gượng ép.
2. Không dùng lại ý hoặc cấu trúc câu giống các câu đã liệt kê ở trên.
3. Câu tiếng Việt phải tự nhiên, đúng ngữ pháp.
4. Câu tiếng Anh tương ứng (khi học viên dịch đúng) phải tự nhiên như người bản ngữ.
5. Độ khó phải đúng với giới hạn ngữ pháp theo cấp độ đã nêu — KHÔNG vượt quá.
6. Với độ khó "hard": dùng cấu trúc phức tạp hơn phù hợp cấp độ (mệnh đề quan hệ/bị động/điều kiện/hoàn thành/modal/nguyên nhân-kết quả/tương phản), có thể 2 mệnh đề, có bối cảnh thực tế cụ thể — KHÔNG biến câu thành bài kiểm tra ngữ pháp thuần túy, phải giống tình huống đời thực.
7. Không tạo câu dài một cách vô nghĩa (nhồi nhiều ý không liên quan).
8. Không nhất thiết phải nhắc nguyên văn "${vocab.word}" bằng tiếng Anh trong câu tiếng Việt nếu điều đó làm bài quá dễ đoán.
9. CHỈ trả về JSON thuần, không markdown, không giải thích thêm.

{"promptVi":"<câu tiếng Việt>","targetPhrase":"${vocab.word}","difficulty":"${difficulty}","context":"${context}","grammarFocus":"<cấu trúc ngữ pháp chính dùng trong câu, vài từ tiếng Việt>"}`;
}
// Gọi Gemini với 1 prompt bất kỳ (KHÔNG dùng chung với callGemini/evaluateWithGemini — giữ nguyên
// 2 hàm đó để không ảnh hưởng logic chấm điểm hiện tại). Có thử lần lượt các model như evaluateWithGemini.
async function callGeminiRaw(model, promptText){
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(DATA.geminiKey.trim())}`;
  const body = { contents:[{ parts:[{ text: promptText }] }], generationConfig:{ temperature:0.85, responseMimeType:'application/json' } };
  const ctrl = new AbortController(); const timer = setTimeout(()=>ctrl.abort(), 20000);
  let res;
  try{ res = await fetch(url,{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body), signal:ctrl.signal }); }
  catch(e){ clearTimeout(timer); throw new Error(e.name==='AbortError'?'TIMEOUT':'NETWORK'); }
  clearTimeout(timer);
  if(!res.ok){
    let emsg=''; try{ const ej=await res.json(); emsg=(ej?.error?.message||ej?.error?.status||'')+''; }catch(_){}
    const lm=emsg.toLowerCase();
    if(res.status===404 || lm.includes('not found') || lm.includes('unknown model')){ const er=new Error('MODEL_NOT_FOUND'); er._badModel=true; throw er; }
    if(res.status===401||res.status===403 || lm.includes('api key') || lm.includes('permission')) throw new Error('BAD_KEY');
    if(res.status===429 || lm.includes('quota') || lm.includes('rate limit')){ const er=new Error('RATE_LIMIT'); er._perDay=/per day|daily|rpd/.test(lm); throw er; }
    if(res.status>=500) throw new Error('SERVER');
    throw new Error('HTTP_'+res.status);
  }
  const data = await res.json();
  let text = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
  text = text.replace(/```json|```/g,'').trim();
  let json; try{ json=JSON.parse(text); }catch(e){ const m=text.match(/\{[\s\S]*\}/); if(m) json=JSON.parse(m[0]); else throw new Error('PARSE'); }
  return json;
}
async function generateExerciseWithGemini(promptText){
  if(!hasKey()) throw new Error('NO_KEY');
  if(!isOnline()) throw new Error('OFFLINE');
  const saved = currentModel();
  const models = [saved, ...GEMINI_MODELS.filter(m=>m!==saved)];
  let lastErr = new Error('RATE_LIMIT');
  for(const model of models){
    try{
      const json = await callGeminiRaw(model, promptText);
      DATA.geminiModel = model; try{ save(); }catch(_){}
      return json;
    }catch(e){
      lastErr = e;
      if(e.message==='BAD_KEY' || e.message==='OFFLINE') throw e;
      if(e.message==='RATE_LIMIT' && e._perDay) throw new Error('RATE_LIMIT_DAY');
      continue; // model lỗi/nghẽn → thử model kế
    }
  }
  throw lastErr;
}
// Sinh 1 câu "khó" MỚI cho từ, tránh trùng với các câu gần đây (tối đa 2 lần thử lại), lưu cache.
async function generateHardExercise(vocab){
  const recentList = vocabRecentPrompts(vocab.id);
  let lastEx=null;
  for(let attempt=0; attempt<=2; attempt++){
    const json = await generateExerciseWithGemini(buildExerciseGenPrompt(vocab, 'hard', recentList));
    const ex = {
      promptVi: String(json.promptVi||'').trim(),
      targetPhrase: String(json.targetPhrase||vocab.word).trim(),
      difficulty:'hard', level:'hard',
      context: String(json.context||'').trim(),
      grammarFocus: String(json.grammarFocus||'').trim(),
      ts: Date.now(),
    };
    if(!ex.promptVi) continue;
    lastEx = ex;
    const dup = recentList.some(p=>tooSimilar(p, ex.promptVi));
    if(!dup) return ex; // đủ khác biệt → dùng luôn
    // quá giống → thử lại (tối đa 2 lần), vòng sau AI thấy chính câu vừa bị từ chối trong recentList lần tới
  }
  if(lastEx) return lastEx; // vẫn còn hơn không, hiếm khi tới đây
  throw new Error('GEN_FAILED');
}
// Lấy 1 đề "khó" để hiển thị: ưu tiên random trong pool có sẵn (câu mẫu + câu đã cache),
// tránh gọi AI mỗi lần mở lại cùng 1 từ — chỉ generate thêm khi pool còn ít hoặc để tăng đa dạng.
function hardExercisePool(vocab){
  const fixed = getExercises(vocab).find(e=>e.level==='hard');
  const cached = (DATA.generatedExercises && DATA.generatedExercises[vocab.id]) || [];
  const pool = fixed? [fixed, ...cached] : cached.slice();
  return pool;
}
function pickFromPool(pool, avoidPromptVi){
  const candidates = pool.filter(e=>e.promptVi!==avoidPromptVi);
  const list = candidates.length? candidates : pool;
  return list[Math.floor(Math.random()*list.length)];
}
function cacheGeneratedExercise(vid, ex){
  if(!DATA.generatedExercises) DATA.generatedExercises={};
  if(!DATA.generatedExercises[vid]) DATA.generatedExercises[vid]=[];
  DATA.generatedExercises[vid].push(ex);
  DATA.generatedExercises[vid] = DATA.generatedExercises[vid].slice(-20); // chỉ giữ 20 câu gần nhất/từ
  save();
}

    const hits=allVocab().filter(v=>v.word.toLowerCase().includes(q)||v.meaningVi.toLowerCase().includes(q)||v.topic.includes(q));
    return header('Choose a topic','Học từ vựng')
    + searchBox()
    + (hits.length? `<div class="card" style="padding:6px 16px">${hits.map(vitemHTML).join('')}</div>`
       : `<div class="empty"><div class="e">🔍</div>Không tìm thấy "<b>${state.search}</b>"</div>`);
  }
  return header('Choose a topic','Học từ vựng')
  + searchBox()
  + TOPICS.filter(t=> t.id!=='mywords' || topicTotal('mywords')>0).map(t=>{
      const l=topicLearned(t.id),tt=topicTotal(t.id);
      const mine = t.id==='mywords';
      return `<button class="topic" onclick="openTopic('${t.id}')" style="${mine?'border-color:var(--brand)':''}">
        <span class="emo">${t.emoji}</span>
        <span class="body">
          <span class="t">${t.name}${mine?` <span class="chip" style="font-size:10px;padding:2px 8px">${tt}</span>`:''}</span>

          <span class="progress"><i style="width:${tt?l/tt*100:0}%"></i></span>
        </span>
        <span class="arrow">›</span>
      </button>`;
    }).join('');
}

/* Khối luyện câu ngay dưới flashcard — dùng đúng từ đang xem, 2–3 đề */
function practiceInlineHTML(v){
  const exs = getExercises(v);
  if(!exs.length) return '';
  let idx = state.fxTab; if(idx>=exs.length) idx=0;
  const st = fxGet(v.id, idx);
  const ex = st.curEx || exs[idx]; // đề đang hiển thị: ưu tiên đề đã đổi/AI-sinh cho từ này, else đề mặc định
  const aiOn = hasKey();
  const doneCount = exs.filter((_,i)=>fxGet(v.id,i).result).length;

  const tabs = exs.map((e,i)=>{
    const done = !!fxGet(v.id,i).result;
    const lv = getExercises(v)[i].level;

  let hintHTML='';

    hintHTML=`<div class="hint-panel"><div class="loading-wrap" style="padding:16px"><span class="spin"></span><div>Đang tìm từ gợi ý...</div></div></div>`;
  } else if(st.hints){
    hintHTML=`<div class="hint-panel">
      <div class="lbl">💡 Từ/cụm gợi ý để đặt câu</div>
      ${st.hints.length? st.hints.map((h,hi)=>{
        const saved = isSaved(h.en);
        return `<div class="hint-item">
          <span style="flex:1;min-width:0"><span class="en">${escapeHtml(h.en)}</span>
            <span class="vi" style="display:block">${escapeHtml(h.vi||'')}</span></span>
          <span class="acts">
            <button class="hint-btn" title="Nghe" onclick="speak('${escq(h.en)}')">${svg(IC.sound,15)}</button>
            <button class="hint-btn" title="Chèn vào câu" onclick="fxInsertWord('${v.id}',${idx},'${escq(h.en)}')">➕</button>
            <button class="hint-btn ${saved?'saved':''}" title="${saved?'Đã lưu':'Lưu vào Từ của tôi'}"
              onclick="fxSaveWord('${escq(h.en)}','${escq(h.vi||'')}')">${saved?'✓':'⭐'}</button>
          </span>
        </div>`;
      }).join('') : `<div class="card-sub">Không có gợi ý cho câu này.</div>`}

    ${(isOnline()&&!aiOn)?`<div class="banner">💡 Bật AI trong Cài đặt để chấm chi tiết. Giờ dùng chấm cơ bản.

    ${exs[idx].level==='hard' ? `<div style="display:flex;justify-content:flex-end;margin-bottom:8px">
      <button class="btn btn-outline btn-sm" style="width:auto" onclick="fxNewHardExercise('${v.id}',${idx})" ${st.exLoading?'disabled':''}>

        <span class="lvl-badge lvl-${ex.level}">${ex.level==='medium'?'🟢':ex.level==='good'?'🟡':'🔴'} ${LEVEL_VI[ex.level]}</span>

      <div class="txt">${ex.promptVi}</div>

        ${aiOn&&isOnline()?'✨ Đánh giá bằng AI':'Đánh giá'}${st.result?' lại':''}</button>
    </div>

    ${hintHTML}
    ${resultHTML}
  </div>`;
}

function miniResultHTML(r){
  const color = r.score>=90?'var(--success)':r.score>=70?'var(--brand)':'var(--warn)';
  const verdict = r.score>=90?'Excellent! 🎉':r.score>=70?'Tốt lắm 👍':'Cần luyện thêm 💪';
  const badge = r._local?`<span class="local-badge">⚙️ Máy</span>`:`<span class="ai-badge">✨ AI</span>`;
  const changed = r.correctedSentence && r.originalSentence &&
    r.correctedSentence.trim().toLowerCase()!==r.originalSentence.trim().toLowerCase();
  const best = r.bestVersion || r.moreNaturalVersion;
  return `<div class="mini-result" style="border-color:${color}">
    <div class="top">
      <span class="sc" style="color:${color}">${r.score}<span style="font-size:15px;color:var(--muted)">/100</span></span>
      <span style="font-weight:600;color:${color};font-size:14px">${verdict}</span>
      <span style="flex:1"></span>${badge}

    ${r.fixes?.length?`<div class="fixes" style="margin-top:6px">

      </div>
      ${r.fixes.map(f=>fixItemHTML(f, r, {showSave:true})).join('')}
    </div>`:''}

    ${changed?`<div class="corrected-box">
      <div class="lbl">✅ Câu của bạn sau khi sửa</div>
      <div class="txt">${highlightDiff(r.originalSentence, r.correctedSentence)}</div>
      <div class="acts" style="margin-top:8px"><button class="btn btn-ghost btn-sm" style="width:auto" onclick="speak('${escq(r.correctedSentence)}')">${svg(IC.sound,16)} Nghe</button></div>
    </div>`:''}

    ${r.feedback?.length?`<div class="mini-fb" style="margin-top:10px">${r.feedback.map(f=>'• '+escapeHtml(f)).join('<br>')}</div>`:''}

    ${best?`<div class="best-box">

        <button class="btn btn-outline btn-sm" style="width:auto" onclick="fxCopyBest('${escq(best)}')">📋 Dùng câu này</button>
      </div>
    </div>`:''}
  </div>`;
}
// tô đậm những từ đã thay đổi so với câu gốc
function highlightDiff(orig, corrected){
  const oWords = (orig||'').trim().split(/\s+/);
  const cWords = (corrected||'').trim().split(/\s+/);
  const oSet = new Set(oWords.map(w=>w.toLowerCase().replace(/[^a-z0-9']/g,'')));
  return cWords.map(w=>{
    const clean=w.toLowerCase().replace(/[^a-z0-9']/g,'');
    return oSet.has(clean)? escapeHtml(w) : `<span class="hl-change">${escapeHtml(w)}</span>`;
  }).join(' ');
}
